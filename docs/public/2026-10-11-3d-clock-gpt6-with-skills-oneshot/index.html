<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080c12">
  
  <title>Stilltime - 3D Clock with Picture-in-Picture</title>

  <meta name="description" content="An animated digital clock with four customizable themes. Keep it floating above your workspace.">

  <link rel="canonical" href="https://toys.awwtools.com/public/2026-10-11-3d-clock-gpt6-with-skills-oneshot/">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stilltime">
  <meta property="og:title" content="Stilltime - 3D Clock with Picture-in-Picture">
  <meta property="og:description" content="An animated digital clock with four customizable themes. Keep it floating above your workspace.">
  <meta property="og:url" content="https://toys.awwtools.com/public/2026-10-11-3d-clock-gpt6-with-skills-oneshot/">
  <meta property="og:image" content="https://toys.awwtools.com/public/2026-10-11-3d-clock-gpt6-with-skills-oneshot/social.jpg">
  <meta property="og:image:secure_url" content="https://toys.awwtools.com/public/2026-10-11-3d-clock-gpt6-with-skills-oneshot/social.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Stilltime 3D digital clock with atmospheric lighting and dimensional numerals">
  <meta property="og:locale" content="en_US">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Stilltime - 3D Clock with Picture-in-Picture">
  <meta name="twitter:description" content="An animated digital clock with four customizable themes. Keep it floating above your workspace.">
  <meta name="twitter:image" content="https://toys.awwtools.com/public/2026-10-11-3d-clock-gpt6-with-skills-oneshot/social.jpg">
  <meta name="twitter:image:alt" content="Stilltime 3D digital clock with atmospheric lighting and dimensional numerals">



  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <div id="app" class="app" data-theme="chrome" data-motion="medium">
    <div class="ambient" aria-hidden="true">
      <div class="ambient__halo"></div>
      <div class="ambient__orbit ambient__orbit--one"></div>
      <div class="ambient__orbit ambient__orbit--two"></div>
      <div class="ambient__noise"></div>
    </div>

    <header class="masthead">
      <div class="identity"><span class="identity__mark" aria-hidden="true"></span><span>STILL<span class="identity__thin">TIME</span></span></div>
      <div class="live-indicator"><span class="live-indicator__dot" aria-hidden="true"></span> LIVE / LOCAL TIME</div>
    </header>

    <main class="stage" id="stage">
      <div class="composition">
        <div class="eyebrow"><span>TIME, IN FORM</span><span id="themeLabel">01 / CHROME</span></div>
        <div id="mainScene" class="clock-scene">
          <div id="mainClock" class="clock-face" role="timer" aria-live="off" aria-label="Current time"></div>
        </div>
        <div class="underclock"><span class="underclock__line"></span><span id="formatLabel">24 HOUR · WITH SECONDS</span><span class="underclock__line"></span></div>
      </div>
    </main>

    <div class="corner-note" aria-hidden="true">MOVE TO EXPLORE DEPTH</div>
    <div class="version-note" aria-hidden="true">ST / 001</div>

    <nav id="toolbar" class="toolbar" aria-label="Clock actions">
      <button type="button" id="settingsButton" class="action action--quiet" aria-haspopup="dialog" aria-controls="settingsDialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16M9 4v6M15 14v6"/></svg>
        <span>Customize</span>
      </button>
      <span class="toolbar__divider" aria-hidden="true"></span>
      <button type="button" id="pipButton" class="action action--primary">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.75" y="4.5" width="18.5" height="15" rx="2"/><rect x="11.5" y="11.75" width="7.5" height="5.25" rx=".8"/></svg>
        <span id="pipButtonText">Float clock</span>
      </button>
    </nav>
  </div>

  <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
    <div class="settings-header">
      <div><p class="settings-kicker">PERSONALIZE YOUR CLOCK</p><h2 id="settingsTitle">Appearance</h2></div>
      <button type="button" id="closeSettings" class="icon-button" aria-label="Close settings">&times;</button>
    </div>
    <div class="settings-body">
      <fieldset class="theme-picker">
        <legend>Visual theme</legend>
        <div class="theme-grid" id="themeGrid">
          <button class="theme-tile" type="button" data-theme-choice="chrome" aria-pressed="true"><span class="theme-preview theme-preview--chrome">12:08</span><span>Chrome</span></button>
          <button class="theme-tile" type="button" data-theme-choice="neon" aria-pressed="false"><span class="theme-preview theme-preview--neon">12:08</span><span>Neon</span></button>
          <button class="theme-tile" type="button" data-theme-choice="glass" aria-pressed="false"><span class="theme-preview theme-preview--glass">12:08</span><span>Glass</span></button>
          <button class="theme-tile" type="button" data-theme-choice="minimal" aria-pressed="false"><span class="theme-preview theme-preview--minimal">12:08</span><span>Minimal</span></button>
        </div>
      </fieldset>
      <div class="setting-row"><label for="accentColor">Accent color</label><input id="accentColor" type="color" value="#a8c8f8"></div>
      <div class="setting-row"><label for="motionSelect">Motion intensity</label><select id="motionSelect"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select></div>
      <div class="setting-row"><label for="timeFormat">Time format</label><select id="timeFormat"><option value="24">24 hour</option><option value="12">12 hour</option></select></div>
      <div class="setting-row"><label for="showSeconds">Show seconds</label><input id="showSeconds" type="checkbox" checked></div>
    </div>
    <div class="settings-footer"><button id="resetSettings" type="button">Reset to defaults</button><span>Saved on this device</span></div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <video id="pipVideo" class="pip-video" muted playsinline aria-hidden="true" tabindex="-1"></video>
</body>
</html>
