:root {
    color-scheme: dark;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    background: #000;
    color: #f4f4f4;
}

* {
    box-sizing: border-box;
}

html,
body {
    min-height: 100%;
    margin: 0;
    background: #000;
}

body {
    display: grid;
    place-items: center;
    padding: 24px;
}

button,
canvas {
    -webkit-tap-highlight-color: transparent;
}

.app-shell {
    width: min(100%, 560px);
    display: grid;
    justify-items: center;
    gap: 18px;
}

.app-header {
    text-align: center;
}

.app-header h1 {
    margin: 0;
    font-size: clamp(1.55rem, 4vw, 2rem);
    font-weight: 650;
    letter-spacing: 0.01em;
}

.app-header p {
    margin: 8px 0 0;
    color: #9a9a9a;
    font-size: 0.95rem;
}

.preview-panel {
    position: relative;
    width: 100%;
}

#studyCanvas {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    border: 1px solid #242424;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 18px 60px rgb(0 0 0 / 45%);
}

.media-transport {
    position: absolute;
    width: 1px;
    height: 1px;
    left: 0;
    bottom: 0;
    opacity: 0;
    pointer-events: none;
}

.pip-button {
    min-width: 230px;
    min-height: 44px;
    padding: 10px 18px;
    border: 1px solid #454545;
    border-radius: 9px;
    background: #151515;
    color: #f5f5f5;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 140ms ease, border-color 140ms ease, transform 140ms ease;
}

.pip-button:hover:not(:disabled) {
    background: #1d1d1d;
    border-color: #656565;
}

.pip-button:active:not(:disabled) {
    transform: translateY(1px);
}

.pip-button:focus-visible {
    outline: 2px solid #d9e8ff;
    outline-offset: 3px;
}

.pip-button:disabled {
    color: #777;
    border-color: #292929;
    background: #0c0c0c;
    cursor: not-allowed;
}

.status-message {
    min-height: 1.4em;
    max-width: 48ch;
    margin: 0;
    color: #b7b7b7;
    font-size: 0.88rem;
    line-height: 1.45;
    text-align: center;
}

.status-message[data-kind="error"] {
    color: #f0b8b8;
}

@media (max-width: 520px) {
    body {
        padding: 14px;
    }

    .app-shell {
        gap: 14px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .pip-button {
        transition: none;
    }
}
</style>
</head>

                muted
                playsinline
                aria-hidden="true"

        const card = state.card;
        if (!card) return;
        const fade = 1 - phaseReveal(now, Core.PHASES.TRANSITION);
        if (fade <= 0.001) {
            return;
        }

        const theme = THEMES[state.themeIndex] ?? THEMES[0];
        drawText(card.kanji, {
            y: 126,
            size: 88,
            minSize: 70,
            maxWidth: 220,
            family: MINCHO_FONT,
            weight: 500,
            color: theme.foreground,
            alpha: fade * 0.55
        });
    }

    /** @param {number} [now=performance.now()] */
    function render(now = performance.now()) {
        if (!state.card) {
            return;
        }

        drawBackground(now);

        const progress = Core.getProgress(now, state.cardStartedAt, CARD_DURATION_MS);
        const phase = Core.getPhase(progress);
        const primaryExample = state.examples[0];
        const secondaryPrompt = state.secondaryPrompt;

        switch (phase) {
            case Core.PHASES.KANJI:
            case Core.PHASES.KANJI_READING:
            case Core.PHASES.KANJI_MEANING:
                drawKanjiQuestion(now, phase);
                break;

            case Core.PHASES.WORD_1:
            case Core.PHASES.WORD_1_READING:
            case Core.PHASES.WORD_1_MEANING:
                if (primaryExample) drawVocabulary(primaryExample, phase, now, false);
                break;

            case Core.PHASES.WORD_2:
            case Core.PHASES.WORD_2_ANSWER:
                if (!secondaryPrompt) break;
                if (secondaryPrompt.type === "sentence") {
                    drawSentence(secondaryPrompt.data, phase, now);
                } else {
                    drawVocabulary(secondaryPrompt.data, phase, now, true);
                }
                break;

            case Core.PHASES.TRANSITION:
                drawTransition(now);
                break;

            default:
                break;
        }

        drawClock();
    }

    /**
     * @param {number} now
     * @returns {number}
     */
    function getNextDelay(now) {
        const progress = Core.getProgress(now, state.cardStartedAt, CARD_DURATION_MS);
        const phase = Core.getPhase(progress);
        const phaseRange = Core.getPhaseRange(phase);
        const phaseStartedAt = state.cardStartedAt + phaseRange.start * CARD_DURATION_MS;
        const phaseEndsAt = state.cardStartedAt + phaseRange.end * CARD_DURATION_MS;
        const phaseAnimationDuration = reducedMotionQuery.matches ? 0 : PHASE_ANIMATION_MS[phase] ?? 0;
        const phaseAnimationEndsAt = phaseStartedAt + phaseAnimationDuration;
        const backgroundAnimationEndsAt = state.backgroundBlendStartedAt + (reducedMotionQuery.matches ? 0 : CONFIG.BACKGROUND_SHIFT_MS);
        const animationActive = now < phaseAnimationEndsAt || now < backgroundAnimationEndsAt;

        if (animationActive) {
            return FRAME_INTERVAL_MS;
        }

        const untilPhaseBoundary = Math.max(16, phaseEndsAt - now);
        const untilClockBoundary = Core.millisecondsUntilNextClockBoundary(Date.now(), CONFIG.SHOW_SECONDS_IN_CLOCK);
        return Math.max(16, Math.min(untilPhaseBoundary, untilClockBoundary));
    }

    /** Schedules the next required redraw without polling static phases. */
    function scheduleNextRender() {
        window.clearTimeout(state.timerId);
        const now = performance.now();
        state.timerId = window.setTimeout(tick, getNextDelay(now));
    }

    /** Advances expired cards, renders, and schedules the next meaningful update. */
    function tick() {
        const now = performance.now();

        if (now - state.cardStartedAt >= CARD_DURATION_MS) {
            startNextCard(now);
        }

        render(now);
        scheduleNextRender();
    }

    /** @returns {boolean} */
    function isStandardPiPSupported() {
        return Boolean(
            state.captureAvailable &&
            document.pictureInPictureEnabled &&
            typeof video.requestPictureInPicture === "function" &&
            typeof document.exitPictureInPicture === "function"
        );
    }

    /** Synchronizes the single user-facing control with media/PiP state. */
    function updatePiPControl() {
        state.pipSupported = isStandardPiPSupported();

        if (!state.captureAvailable) {
            pipButton.disabled = true;
            pipButton.textContent = "Picture-in-Picture unavailable";
            return;
        }

        if (!state.pipSupported) {
            pipButton.disabled = true;
            pipButton.textContent = "Picture-in-Picture unavailable";
            return;
        }

        if (document.pictureInPictureElement === video) {
            pipButton.disabled = false;
            pipButton.textContent = "Exit Picture-in-Picture";
            return;
        }

        pipButton.disabled = !state.mediaReady;
        pipButton.textContent = state.mediaReady
            ? "Enter Picture-in-Picture"
            : "Preparing Picture-in-Picture";
    }

    /** @returns {Promise<void>} */
    async function ensureVideoPlaying() {
        video.muted = true;
        await video.play();
    }

    /** Connects the canvas stream to the muted transport video. */
    function setupMedia() {
        if (!state.captureAvailable) {
            setStatus("Canvas video capture is unavailable in this browser. The study preview will continue normally.", "error");
            updatePiPControl();
            return;
        }

        try {
            state.mediaStream = canvas.captureStream(CONFIG.CAPTURE_FPS);
            video.srcObject = state.mediaStream;
        } catch (error) {
            state.captureAvailable = false;
            reportError("Canvas video capture failed", error);
            updatePiPControl();
            return;
        }

        video.addEventListener("loadedmetadata", () => {
            state.mediaReady = true;
            updatePiPControl();
        }, { once: true });

        video.addEventListener("error", () => {
            const mediaError = video.error;
            const detail = mediaError ? `Media error code ${mediaError.code}` : "Unknown video error";
            reportError("Generated video playback failed", new Error(detail));
        });

        void ensureVideoPlaying().catch((error) => {
            reportError("Generated video could not autoplay", error);
            updatePiPControl();
        });

        updatePiPControl();
    }

    /** @returns {Promise<void>} */
    async function togglePictureInPicture() {
        if (!state.pipSupported) {
            setStatus("Picture-in-Picture is unavailable in this browser. The canvas preview remains active.", "error");
            return;
        }

        try {
            if (document.pictureInPictureElement === video) {
                await document.exitPictureInPicture();
                setStatus("");
                return;
            }

            await ensureVideoPlaying();
            await video.requestPictureInPicture();
            setStatus("");
        } catch (error) {
            reportError("Picture-in-Picture request failed", error);
        } finally {
            updatePiPControl();
        }
    }

    /** Binds the small set of lifecycle and PiP events used by the application. */
    function bindEvents() {
        pipButton.addEventListener("click", () => {
            void togglePictureInPicture();
        });

        video.addEventListener("enterpictureinpicture", () => {
            updatePiPControl();
            render(performance.now());
        });

        video.addEventListener("leavepictureinpicture", () => {
            updatePiPControl();
            render(performance.now());
        });

        reducedMotionQuery.addEventListener("change", () => {
            render(performance.now());
            scheduleNextRender();
        });

        window.addEventListener("pagehide", () => {
            window.clearTimeout(state.timerId);
        });

        window.addEventListener("pageshow", () => {
            if (state.initialized) {
                render(performance.now());
                scheduleNextRender();
            }
        });
    }

    /** Validates source data and starts rendering/media initialization. */
    function initialize() {
        try {
            Core.validateCorpus(KANJI_DATA);
        } catch (error) {
            reportError("Kanji corpus validation failed", error);
            pipButton.disabled = true;
            pipButton.textContent = "Picture-in-Picture unavailable";
            return;
        }

        bindEvents();
        startNextCard(performance.now());
        render(performance.now());
        setupMedia();
        state.initialized = true;
        scheduleNextRender();
    }

    initialize();
})();
</script>
</body>
</html>
