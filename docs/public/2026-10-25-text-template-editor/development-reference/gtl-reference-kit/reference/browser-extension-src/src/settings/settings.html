<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eye05 Settings</title>
  <link rel="stylesheet" href="settings.css">
  <script src="settings_runtime.js"></script>
  <script defer src="settings.js"></script>
</head>
<body>
  <main class="settings-container" data-testid="settings-main-region-root">
    <header class="settings-header">
      <div>
        <h1 class="settings-title">eye05 Settings</h1>
        <p class="settings-subtitle">Configure preview behavior, minibuffer tools, bookmarks, and privacy.</p>
      </div>
      <button id="global-reset" class="lp-button lp-danger" data-testid="settings-main-button-reset-all">Reset all</button>
    </header>
    <div id="settings-root" class="settings-root" aria-live="polite" aria-busy="true" data-testid="settings-main-region-content">
      Loading settings...
    </div>
  </main>
</body>
</html>
