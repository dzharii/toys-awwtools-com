<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 585" width="1200" height="585" role="img" aria-label="Desktop editing workspace">
<rect width="1200" height="585" rx="16" fill="#0f1115"/>
<text x="28" y="38" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="660" fill="#f3f0ea">Desktop editing workspace</text>
<text x="28" y="61" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#aaa9b3">Proposed GTL layout • not a screenshot of the source project</text>
<rect x="25" y="88" width="228" height="465" rx="11" fill="#15171c" stroke="#3b3c45" stroke-width="1.3"/>
<text x="45" y="119" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="700" fill="#e9e5dc">DOCUMENTS</text>
<rect x="44" y="140" width="190" height="42" rx="11" fill="#3d3730" stroke="#b48b56" stroke-width="1.3"/>
<text x="60" y="167" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="650" fill="#fff0db">+  New document</text>
<rect x="42" y="188" width="194" height="41" rx="8" fill="#303037" stroke="#69666e" stroke-width="1.3"/>
<text x="54" y="213" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#fff">Project description</text>
<text x="54" y="265" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#aaa9b3">Bug-report response</text>
<text x="54" y="317" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#aaa9b3">Quick reply</text>
<text x="54" y="369" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#aaa9b3">Release notes</text>
<text x="48" y="525" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#aeabb0">Settings   ·   History</text>
<rect x="268" y="88" width="642" height="465" rx="11" fill="#1a1b20" stroke="#3b3c45" stroke-width="1.3"/>
<text x="296" y="124" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="650" fill="#aaa9b3">PROJECT DESCRIPTION</text>
<text x="296" y="154" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="660" fill="#f1eee7">Input + processing + output  ▾</text>
<rect x="289" y="178" width="602" height="175" rx="11" fill="#24252b" stroke="#3b3c45" stroke-width="1.3"/>
<text x="307" y="206" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="650" fill="#aeaeb6">EDITABLE DOCUMENT</text>
<text x="310" y="248" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="400" fill="#f3eee7">Takes [pasted JSON], [checks it for syntax errors],</text>
<text x="310" y="282" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="400" fill="#f3eee7">and produces [formatted JSON].</text>
<rect x="460" y="260" width="350" height="34" rx="7" fill="#463d31" stroke="#a98c62" stroke-width="1.3"/>
<text x="477" y="283" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#f8e4bf">[checks it for syntax errors]</text>
<text x="295" y="390" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="650" fill="#aaa9b3">FINAL RESULT</text>
<rect x="289" y="410" width="602" height="88" rx="11" fill="#212328" stroke="#3b3c45" stroke-width="1.3"/>
<text x="307" y="445" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e7e8eb">Takes pasted JSON, checks it for syntax errors,</text>
<text x="307" y="471" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="400" fill="#e7e8eb">and produces formatted JSON.</text>
<text x="715" y="530" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#d0b28c">Copy text   ·   Copy rich text</text>
<rect x="925" y="88" width="249" height="465" rx="11" fill="#242225" stroke="#3b3c45" stroke-width="1.3"/>
<text x="946" y="119" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f4ecde">GUIDANCE</text>
<text x="946" y="160" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="600" fill="#f1f0f2">What happens to the input?</text>
<text x="945" y="204" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#c4c0c3">Describe the main operation</text>
<text x="945" y="228" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#c4c0c3">in present tense. Start with</text>
<text x="945" y="252" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="400" fill="#c4c0c3">a verb, not a full sentence.</text>
<text x="945" y="305" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1a96e">EXAMPLE</text>
<text x="945" y="333" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#e4e0dc">checks it for syntax errors</text>
<rect x="945" y="365" width="210" height="42" rx="8" fill="#333034" stroke="#55515b" stroke-width="1.3"/>
<text x="965" y="393" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#f2e8e2">Use example</text>
<text x="945" y="507" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#b5b0af">Pin   ·   Collapse</text>
</svg>