<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 605" width="1120" height="605" role="img" aria-label="Mobile document editing">
<rect width="1120" height="605" rx="16" fill="#0f1115"/>
<text x="28" y="38" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="660" fill="#f3f0ea">Mobile document editing</text>
<text x="28" y="61" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#aaa9b3">A single editing column and compact guidance, without covering the caret</text>
<rect x="61" y="90" width="360" height="482" rx="25" fill="#181a1e" stroke="#75767f" stroke-width="1.3"/>
<rect x="78" y="109" width="328" height="48" rx="11" fill="#292a30" stroke="#484950" stroke-width="1.3"/>
<text x="96" y="138" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="400" fill="#e4e4e9">☰</text>
<text x="152" y="139" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="650" fill="#f0f0f3">Project description</text>
<rect x="78" y="174" width="328" height="270" rx="11" fill="#24262c" stroke="#3b3c45" stroke-width="1.3"/>
<text x="95" y="200" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="650" fill="#ddcaac">Input + processing + output</text>
<text x="95" y="237" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="400" fill="#f6f4ed">Takes [pasted JSON],</text>
<rect x="92" y="251" width="287" height="40" rx="11" fill="#463d31" stroke="#bb985c" stroke-width="1.3"/>
<text x="103" y="277" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#ffebc8">[checks it for errors]</text>
<text x="95" y="327" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="400" fill="#f2f2f0">and produces [formatted JSON].</text>
<text x="95" y="402" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#b6b6bf">Scroll to final result ↓</text>
<rect x="78" y="461" width="328" height="94" rx="11" fill="#333038" stroke="#9b845e" stroke-width="1.3"/>
<text x="94" y="485" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="650" fill="#f1dab4">GUIDANCE (compact, nonmodal)</text>
<text x="94" y="512" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#f4f4f4">What happens to the input?</text>
<text x="94" y="538" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#cbc9d0">Example: validates JSON</text>
<rect x="520" y="90" width="540" height="183" rx="11" fill="#22252b" stroke="#3b3c45" stroke-width="1.3"/>
<text x="542" y="126" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="650" fill="#f2efe9">Rules for small screens</text>
<text x="545" y="166" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#ced0d7">• The document remains the primary surface.</text>
<text x="545" y="193" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#ced0d7">• Menu becomes an off-canvas drawer.</text>
<text x="545" y="220" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#ced0d7">• Guidance is docked above the keyboard.</text>
<text x="545" y="247" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#ced0d7">• Never cover the active caret or scroll to end.</text>
<rect x="520" y="294" width="540" height="240" rx="11" fill="#242b28" stroke="#56725f" stroke-width="1.3"/>
<text x="543" y="329" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650" fill="#e6f0e5">Placeholder guidance states</text>
<text x="545" y="372" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#c4d9cc">• Follow focused placeholder</text>
<text x="545" y="402" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#c4d9cc">• Pin a specific explanation</text>
<text x="545" y="432" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#c4d9cc">• Collapse when more room is needed</text>
<text x="545" y="462" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#c4d9cc">• Hints and examples remain selectable/copyable</text>
<text x="545" y="492" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" font-weight="400" fill="#c4d9cc">• Restore selection/focus after actions</text>
</svg>