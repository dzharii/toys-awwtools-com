<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Document workflow">
<rect width="1200" height="440" rx="16" fill="#0f1115"/>
<text x="28" y="38" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="23" font-weight="660" fill="#f3f0ea">Document workflow</text>
<text x="28" y="61" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#aaa9b3">Each step is an application interaction; the template DSL remains declarative</text>
<rect x="25" y="125" width="215" height="140" rx="11" fill="#22252b" stroke="#484a54" stroke-width="1.3"/>
<text x="41" y="173" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650" fill="#f6f2ed">1  New document</text>
<text x="41" y="207" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#babac3">Create a history item</text>
<line x1="242" y1="196" x2="260" y2="196" stroke="#c9a36c" stroke-width="2" stroke-linecap="round"/>
<polygon points="260.00,196.00 251.90,199.91 251.90,192.09" fill="#c9a36c"/>
<rect x="264" y="125" width="215" height="140" rx="11" fill="#22252b" stroke="#484a54" stroke-width="1.3"/>
<text x="280" y="173" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650" fill="#f6f2ed">2  Select version</text>
<text x="280" y="207" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#babac3">Choose the text structure</text>
<line x1="481" y1="196" x2="499" y2="196" stroke="#c9a36c" stroke-width="2" stroke-linecap="round"/>
<polygon points="499.00,196.00 490.90,199.91 490.90,192.09" fill="#c9a36c"/>
<rect x="503" y="125" width="215" height="140" rx="11" fill="#22252b" stroke="#484a54" stroke-width="1.3"/>
<text x="519" y="173" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650" fill="#f6f2ed">3  Edit anywhere</text>
<text x="519" y="207" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#babac3">Whole text + inline placeholders</text>
<line x1="720" y1="196" x2="738" y2="196" stroke="#c9a36c" stroke-width="2" stroke-linecap="round"/>
<polygon points="738.00,196.00 729.90,199.91 729.90,192.09" fill="#c9a36c"/>
<rect x="742" y="125" width="215" height="140" rx="11" fill="#22252b" stroke="#484a54" stroke-width="1.3"/>
<text x="758" y="173" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650" fill="#f6f2ed">4  Preview result</text>
<text x="758" y="207" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#babac3">Live text and rich copy</text>
<line x1="959" y1="196" x2="977" y2="196" stroke="#c9a36c" stroke-width="2" stroke-linecap="round"/>
<polygon points="977.00,196.00 968.90,199.91 968.90,192.09" fill="#c9a36c"/>
<rect x="981" y="125" width="215" height="140" rx="11" fill="#22252b" stroke="#484a54" stroke-width="1.3"/>
<text x="997" y="173" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="650" fill="#f6f2ed">5  Preserve work</text>
<text x="997" y="207" text-anchor="start" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#babac3">Autosave and revision history</text>
<rect x="245" y="315" width="710" height="66" rx="11" fill="#1f2623" stroke="#59765b" stroke-width="1.3"/>
<text x="600" y="343" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="600" fill="#dff1df">Change the version at any time; previously entered values are retained.</text>
<text x="600" y="367" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="400" fill="#b6d4bc">The right guidance panel follows the selected placeholder and can be pinned.</text>
</svg>