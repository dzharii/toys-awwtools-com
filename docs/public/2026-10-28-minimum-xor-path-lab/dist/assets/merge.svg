<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">Equivalent histories merge</title><desc id="desc">Two paths reaching the same cell with XOR 3 need one state because every continuation behaves identically.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60"/></marker></defs><rect width="640" height="240" rx="14" fill="#f1f5f0"/><g font-family="ui-monospace,monospace" font-size="17" fill="#253c37"><rect x="25" y="30" width="150" height="50" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="39" y="61" font-size="17">route A: 3</text><rect x="25" y="155" width="150" height="50" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="39" y="186" font-size="17">route B: 3</text><path d="M175 55L260 112" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M175 180L260 112" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="275" y="85" width="150" height="55" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="289" y="118.5" font-size="17">(cell, 3)</text><path d="M425 112L490 112" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="500" y="85" width="115" height="55" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="514" y="118.5" font-size="17">suffix</text></g></svg>