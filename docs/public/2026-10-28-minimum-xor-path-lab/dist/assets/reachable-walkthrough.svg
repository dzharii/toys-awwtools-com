<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 418" role="img" aria-labelledby="title desc"><title id="title">All reachable sets in the counterexample</title><desc id="desc">Grid [[0,1,0],[2,0,2]] has row-major sets {0}, {1}, {1}, {2}, {1,2}, {0,3}. At the destination, incoming state 1 produces 3 and incoming state 2 produces 0.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="418" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="28" fill="#263d36" font-size="16">cell value above; reachable set below</text><rect x="20" y="49" width="130" height="104" rx="7" fill="#fff" stroke="#b6cabe"/><text x="30" y="72" fill="#61776a" font-size="14">(0,0)</text><text x="30" y="102" fill="#263d36" font-size="18">value 0</text><text x="30" y="133" fill="#176b60" font-size="23">{0}</text><path d="M151 100L172 100" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><path d="M85 154L85 194" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="175" y="49" width="130" height="104" rx="7" fill="#fff" stroke="#b6cabe"/><text x="185" y="72" fill="#61776a" font-size="14">(0,1)</text><text x="185" y="102" fill="#263d36" font-size="18">value 1</text><text x="185" y="133" fill="#176b60" font-size="23">{1}</text><path d="M306 100L327 100" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><path d="M240 154L240 194" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="49" width="130" height="104" rx="7" fill="#fff" stroke="#b6cabe"/><text x="340" y="72" fill="#61776a" font-size="14">(0,2)</text><text x="340" y="102" fill="#263d36" font-size="18">value 0</text><text x="340" y="133" fill="#176b60" font-size="23">{1}</text><path d="M395 154L395 194" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="199" width="130" height="104" rx="7" fill="#fff" stroke="#b6cabe"/><text x="30" y="222" fill="#61776a" font-size="14">(1,0)</text><text x="30" y="252" fill="#263d36" font-size="18">value 2</text><text x="30" y="283" fill="#176b60" font-size="23">{2}</text><path d="M151 250L172 250" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="175" y="199" width="130" height="104" rx="7" fill="#fff" stroke="#b6cabe"/><text x="185" y="222" fill="#61776a" font-size="14">(1,1)</text><text x="185" y="252" fill="#263d36" font-size="18">value 0</text><text x="185" y="283" fill="#176b60" font-size="23">{1,2}</text><path d="M306 250L327 250" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="330" y="199" width="130" height="104" rx="7" fill="#d9eadd" stroke="#b6cabe"/><text x="340" y="222" fill="#61776a" font-size="14">(1,2)</text><text x="340" y="252" fill="#263d36" font-size="18">value 2</text><text x="340" y="283" fill="#176b60" font-size="23">{0,3}</text><text x="20" y="335" fill="#263d36" font-size="18">Destination: incoming {1,2}</text><text x="20" y="366" fill="#263d36" font-size="19">1 XOR 2 = 3;  2 XOR 2 = 0</text><text x="20" y="396" fill="#263d36" font-size="18">Keep {0,3}. Choose 0 only now.</text></g></svg>