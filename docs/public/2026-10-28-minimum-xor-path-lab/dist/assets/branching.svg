<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">Branching paths</title><desc id="desc">Right and down decisions multiply. Distinct path prefixes can meet later.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60"/></marker></defs><rect width="640" height="240" rx="14" fill="#f1f5f0"/><g font-family="ui-monospace,monospace" font-size="17" fill="#253c37"><rect x="30" y="85" width="90" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="44" y="117" font-size="17">start</text><path d="M120 110L210 56" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M120 110L210 170" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="215" y="30" width="100" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="229" y="62" font-size="17">right</text><rect x="215" y="145" width="100" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="229" y="177" font-size="17">down</text><path d="M315 56L415 110" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><path d="M315 170L415 110" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="425" y="85" width="170" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="439" y="117" font-size="17">same cell</text><text x="160" y="225" font-size="15">3 x 3: 6 routes; 10 x 10: 48,620</text></g></svg>