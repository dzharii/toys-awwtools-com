<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 362" role="img" aria-labelledby="title desc"><title id="title">Extend an accumulated XOR</title><desc id="desc">The ten-bit calculation is 5 XOR 3 equals 6, then 6 XOR 5 equals 3. Prefix result 6 replaces the earlier calculation without repeating its cells.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="362" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="30" fill="#263d36" font-size="17">A running XOR summarizes earlier bits.</text><rect x="16" y="52" width="448" height="41" rx="7" fill="#fff" stroke="#b6cabe"/><text x="27" y="78" fill="#263d36" font-size="15">start value</text><text x="215" y="78" fill="#263d36" font-size="19">0000000101</text><text x="420" y="78" fill="#263d36" font-size="19">5</text><rect x="16" y="99" width="448" height="41" rx="7" fill="#fff" stroke="#b6cabe"/><text x="27" y="125" fill="#263d36" font-size="15">XOR next 3</text><text x="215" y="125" fill="#263d36" font-size="19">0000000011</text><text x="420" y="125" fill="#263d36" font-size="19">3</text><rect x="16" y="146" width="448" height="41" rx="7" fill="#dfeee4" stroke="#b6cabe"/><text x="27" y="172" fill="#263d36" font-size="15">prefix result</text><text x="215" y="172" fill="#263d36" font-size="19">0000000110</text><text x="420" y="172" fill="#263d36" font-size="19">6</text><rect x="16" y="193" width="448" height="41" rx="7" fill="#fff" stroke="#b6cabe"/><text x="27" y="219" fill="#263d36" font-size="15">XOR next 5</text><text x="215" y="219" fill="#263d36" font-size="19">0000000101</text><text x="420" y="219" fill="#263d36" font-size="19">5</text><rect x="16" y="240" width="448" height="41" rx="7" fill="#dfeee4" stroke="#b6cabe"/><text x="27" y="266" fill="#263d36" font-size="15">new result</text><text x="215" y="266" fill="#263d36" font-size="19">0000000011</text><text x="420" y="266" fill="#263d36" font-size="19">3</text><text x="20" y="312" fill="#263d36" font-size="18">(5 XOR 3) XOR 5 = 6 XOR 5 = 3</text><text x="20" y="342" fill="#263d36" font-size="16">Two flips cancel in each bit column.</text></g></svg>