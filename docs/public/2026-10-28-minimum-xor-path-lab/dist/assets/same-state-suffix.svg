<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 348" role="img" aria-labelledby="title desc"><title id="title">Equivalent states have the same future</title><desc id="desc">In grid [[1,2],[2,3]], both paths reach cell (1,1) with XOR 0. If extended through cells 2 and 5, both finish at 7. The continuation excludes the shared cell, which is already included in the prefix.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="348" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="28" fill="#263d36" font-size="17">Two prefixes at the same cell (1,1)</text><rect x="20" y="48" width="220" height="67" rx="7" fill="#fff" stroke="#b6cabe"/><text x="31" y="73" fill="#263d36" font-size="16">right, down</text><text x="31" y="99" fill="#263d36" font-size="16">1 XOR 2 XOR 3 = 0</text><rect x="20" y="144" width="220" height="67" rx="7" fill="#fff" stroke="#b6cabe"/><text x="31" y="169" fill="#263d36" font-size="16">down, right</text><text x="31" y="195" fill="#263d36" font-size="16">1 XOR 2 XOR 3 = 0</text><path d="M240 82L286 125" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><path d="M240 177L286 134" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="291" y="92" width="170" height="77" rx="7" fill="#dfeee4" stroke="#b6cabe"/><text x="304" y="119" fill="#263d36" font-size="15">same (cell, x)</text><text x="304" y="148" fill="#263d36" font-size="23">x = 0</text><path d="M375 170L375 239" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><text x="20" y="247" fill="#263d36" font-size="16">Suffix starts AFTER the shared cell.</text><rect x="20" y="266" width="440" height="61" rx="7" fill="#fff" stroke="#b6cabe"/><text x="33" y="291" fill="#263d36" font-size="16">Choose next values 2, then 5:</text><text x="33" y="316" fill="#263d36" font-size="18">both finish: 0 XOR 2 XOR 5 = 7</text></g></svg>