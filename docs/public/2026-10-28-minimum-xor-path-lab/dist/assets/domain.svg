<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">A ten-bit domain</title><desc id="desc">Ten bits represent values from zero to 1023. XOR stays inside this domain.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60"/></marker></defs><rect width="640" height="240" rx="14" fill="#f1f5f0"/><g font-family="ui-monospace,monospace" font-size="17" fill="#253c37"><rect x="35" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="49" y="87" font-size="17">0</text><rect x="92" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="106" y="87" font-size="17">1</text><rect x="149" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="163" y="87" font-size="17">0</text><rect x="206" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="220" y="87" font-size="17">1</text><rect x="263" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="277" y="87" font-size="17">0</text><rect x="320" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="334" y="87" font-size="17">1</text><rect x="377" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="391" y="87" font-size="17">0</text><rect x="434" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="448" y="87" font-size="17">1</text><rect x="491" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="505" y="87" font-size="17">0</text><rect x="548" y="55" width="46" height="52" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="562" y="87" font-size="17">1</text><text x="65" y="160" font-size="17">2 x 2 x 2 x 2 x 2 x 2 x 2 x 2 x 2 x 2</text><text x="200" y="210" font-size="20">1,024 possible states</text></g></svg>