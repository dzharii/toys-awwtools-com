<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">Two valid paths</title><desc id="desc">In a two by two grid, right-down visits 1,2,4 and down-right visits 1,3,4.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60"/></marker></defs><rect width="640" height="240" rx="14" fill="#f1f5f0"/><g font-family="ui-monospace,monospace" font-size="17" fill="#253c37"><rect x="58" y="35" width="64" height="64" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="72" y="73" font-size="17">1</text><rect x="140" y="35" width="64" height="64" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="154" y="73" font-size="17">2</text><rect x="58" y="117" width="64" height="64" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="72" y="155" font-size="17">3</text><rect x="140" y="117" width="64" height="64" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="154" y="155" font-size="17">4</text><path d="M90 67H172V149" fill="none" stroke="#176b60" stroke-width="4"/><path d="M90 67V149H172" fill="none" stroke="#bd7537" stroke-width="4" stroke-dasharray="6 5"/><text x="300" y="83" font-size="17">1 XOR 2 XOR 4 = 7</text><text x="300" y="143" font-size="17">1 XOR 3 XOR 4 = 6</text></g></svg>