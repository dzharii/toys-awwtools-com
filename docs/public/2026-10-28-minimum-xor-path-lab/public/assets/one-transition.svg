<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 416" role="img" aria-labelledby="title desc"><title id="title">Name each number in one transition</title><desc id="desc">Earlier cell numbers 1 and 2 have incomingXor 3. Current cell (1,1) has fixed cellNumber 4. The new running result is newXor 3 XOR 4 equals 7, binary 0000000111.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="416" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="30" fill="#263d36" font-size="18">One move: enter cell (1,1)</text><rect x="20" y="48" width="440" height="90" rx="7" fill="#fff" stroke="#b6cabe"/><text x="34" y="74" fill="#263d36" font-size="17">Earlier cells: 1, then 2</text><text x="34" y="102" fill="#176b60" font-size="19">incomingXor = 1 XOR 2 = 3</text><text x="34" y="125" fill="#263d36" font-size="15">0000000001 XOR 0000000010</text><path d="M240 139L240 170" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="175" width="440" height="65" rx="7" fill="#f6ecdc" stroke="#b6cabe"/><text x="34" y="200" fill="#a66928" font-size="17">Current cell (1,1) has number 4</text><text x="34" y="225" fill="#a66928" font-size="18">cellNumber = 4  (0000000100)</text><path d="M240 241L240 272" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><rect x="20" y="277" width="440" height="100" rx="7" fill="#dfeee4" stroke="#b6cabe"/><text x="34" y="303" fill="#263d36" font-size="17">newXor = incomingXor XOR cellNumber</text><text x="34" y="331" fill="#176b60" font-size="22">       = 3 XOR 4 = 7</text><text x="34" y="358" fill="#263d36" font-size="15">0000000011 XOR 0000000100</text><text x="34" y="395" fill="#176b60" font-size="18">Result bits: 0000000111</text></g></svg>