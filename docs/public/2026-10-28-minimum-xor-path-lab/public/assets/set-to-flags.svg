<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 375" role="img" aria-labelledby="title desc"><title id="title">A set and Boolean flags represent the same states</title><desc id="desc">At cell (1,1), printed number 4, the reachable set is {6,7}. Boolean entries dp[1][1][6] and dp[1][1][7] are true. Every other result index, including 5 and 8, is false.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="375" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="30" fill="#263d36" font-size="17">Same information, two representations</text><rect x="20" y="49" width="440" height="66" rx="7" fill="#e0eee5" stroke="#b6cabe"/><text x="34" y="77" fill="#263d36" font-size="17">cell (1,1), printed number 4</text><text x="34" y="101" fill="#176b60" font-size="20">reachable set S(1,1) = {6,7}</text><text x="20" y="148" fill="#263d36" font-size="17">x: result index   dp[1][1][x]</text><rect x="20" y="162" width="440" height="35" rx="7" fill="#fff" stroke="#b6cabe"/><text x="38" y="186" fill="#263d36" font-size="18">5</text><text x="265" y="186" fill="#718276" font-size="18">false</text><rect x="20" y="203" width="440" height="35" rx="7" fill="#dcebe0" stroke="#b6cabe"/><text x="38" y="227" fill="#263d36" font-size="18">6</text><text x="265" y="227" fill="#176b60" font-size="18">true</text><rect x="20" y="244" width="440" height="35" rx="7" fill="#dcebe0" stroke="#b6cabe"/><text x="38" y="268" fill="#263d36" font-size="18">7</text><text x="265" y="268" fill="#176b60" font-size="18">true</text><rect x="20" y="285" width="440" height="35" rx="7" fill="#fff" stroke="#b6cabe"/><text x="38" y="309" fill="#263d36" font-size="18">8</text><text x="265" y="309" fill="#718276" font-size="18">false</text><text x="20" y="354" fill="#263d36" font-size="16">Other result indices are also false.</text></g></svg>