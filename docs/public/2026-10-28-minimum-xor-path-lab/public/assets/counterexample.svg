<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">XOR reverses order</title><desc id="desc">At a shared cell 1 is smaller than 2, but XOR with 2 gives 3 and 0 respectively.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60"/></marker></defs><rect width="640" height="240" rx="14" fill="#f1f5f0"/><g font-family="ui-monospace,monospace" font-size="17" fill="#253c37"><rect x="40" y="40" width="130" height="55" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="54" y="73.5" font-size="17">prefix 1</text><path d="M170 68L305 68" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="40" width="270" height="55" rx="9" fill="#fff" stroke="#b4c9bf"/><text x="334" y="73.5" font-size="17">1 XOR 2 = 3</text><rect x="40" y="135" width="130" height="55" rx="9" fill="#e1eee7" stroke="#b4c9bf"/><text x="54" y="168.5" font-size="17">prefix 2</text><path d="M170 163L305 163" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#arrow)"/><rect x="320" y="135" width="270" height="55" rx="9" fill="#d4e8dc" stroke="#b4c9bf"/><text x="334" y="168.5" font-size="17">2 XOR 2 = 0</text></g></svg>