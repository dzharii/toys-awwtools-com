<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 442" role="img" aria-labelledby="title desc"><title id="title">Explore cell-and-XOR situations</title><desc id="desc">Grid [[1,2],[3,4]] expands to five reachable nodes. Start XOR 1 branches to XOR 3 at (0,1) and XOR 2 at (1,0). The shared destination (1,1) has two nodes, with final XOR 7 and 6.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="442" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="29" fill="#263d36" font-size="18">A node = (cell, running XOR)</text><rect x="140" y="48" width="200" height="65" rx="7" fill="#e1eee7" stroke="#b6cabe"/><text x="157" y="73" fill="#263d36" font-size="16">(0,0) · value 1</text><text x="157" y="98" fill="#263d36" font-size="19">running XOR 1</text><path d="M180 113L120 166" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><path d="M300 113L360 166" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><text x="28" y="143" fill="#263d36" font-size="15">XOR 2</text><text x="365" y="143" fill="#263d36" font-size="15">XOR 3</text><rect x="20" y="171" width="200" height="65" rx="7" fill="#fff" stroke="#b6cabe"/><text x="37" y="196" fill="#263d36" font-size="16">(0,1) · value 2</text><text x="37" y="221" fill="#263d36" font-size="19">running XOR 3</text><rect x="260" y="171" width="200" height="65" rx="7" fill="#fff" stroke="#b6cabe"/><text x="277" y="196" fill="#263d36" font-size="16">(1,0) · value 3</text><text x="277" y="221" fill="#263d36" font-size="19">running XOR 2</text><path d="M120 236L120 291" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><path d="M360 236L360 291" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><text x="139" y="270" fill="#263d36" font-size="15">XOR 4</text><text x="379" y="270" fill="#263d36" font-size="15">XOR 4</text><rect x="20" y="296" width="200" height="65" rx="7" fill="#f4e9d8" stroke="#b6cabe"/><text x="37" y="321" fill="#263d36" font-size="16">(1,1) · value 4</text><text x="37" y="346" fill="#263d36" font-size="20">final XOR 7</text><rect x="260" y="296" width="200" height="65" rx="7" fill="#d4e8dc" stroke="#b6cabe"/><text x="277" y="321" fill="#263d36" font-size="16">(1,1) · value 4</text><text x="277" y="346" fill="#263d36" font-size="20">final XOR 6</text><text x="20" y="394" fill="#263d36" font-size="16">Same cell. Two reachable situations.</text><text x="20" y="422" fill="#263d36" font-size="16">Compare labels only at the destination.</text></g></svg>