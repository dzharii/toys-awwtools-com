<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" role="img" aria-labelledby="title desc"><title id="title">Alternative predecessor states</title><desc id="desc">The upper predecessor has accumulated XOR 3 and the left predecessor has XOR 2. Each is separately XORed with 4. The results 7 and 6 are kept as a set; the alternatives themselves are not XORed together.</desc><defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60" stroke-width="1.5"/></marker></defs><rect width="480" height="344" rx="10" fill="#f1f5f0"/><g font-family="ui-monospace,monospace"><text x="20" y="30" fill="#263d36" font-size="17">Entering value 4: extend each option.</text><rect x="20" y="55" width="155" height="66" rx="7" fill="#fff" stroke="#b6cabe"/><text x="31" y="79" fill="#263d36" font-size="15">top prefix</text><text x="31" y="106" fill="#263d36" font-size="22">x = 3</text><path d="M175 88L287 88" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><text x="190" y="76" fill="#263d36" font-size="15">XOR 4</text><rect x="300" y="55" width="160" height="66" rx="7" fill="#e0eee5" stroke="#b6cabe"/><text x="315" y="94" fill="#263d36" font-size="17">3 XOR 4 = 7</text><rect x="20" y="160" width="155" height="66" rx="7" fill="#fff" stroke="#b6cabe"/><text x="31" y="184" fill="#263d36" font-size="15">left prefix</text><text x="31" y="211" fill="#263d36" font-size="22">x = 2</text><path d="M175 193L287 193" fill="none" stroke="#176b60" stroke-width="2" marker-end="url(#a)"/><text x="190" y="181" fill="#263d36" font-size="15">XOR 4</text><rect x="300" y="160" width="160" height="66" rx="7" fill="#e0eee5" stroke="#b6cabe"/><text x="315" y="199" fill="#263d36" font-size="17">2 XOR 4 = 6</text><text x="20" y="291" fill="#263d36" font-size="20">Store the alternatives: {6, 7}</text><text x="20" y="323" fill="#263d36" font-size="16">Do not combine the two histories.</text></g></svg>