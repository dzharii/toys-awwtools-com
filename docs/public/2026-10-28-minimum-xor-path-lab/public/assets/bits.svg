<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-labelledby="title desc"><title id="title">XOR truth table</title><desc id="desc">5 XOR 3 is 6: 0101 XOR 0011 equals 0110.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#176b60"/></marker></defs><rect width="640" height="240" rx="14" fill="#f1f5f0"/><g font-family="ui-monospace,monospace" font-size="17" fill="#253c37"><text x="55" y="60" font-size="17">operand A   0 1 0 1     5</text><text x="55" y="105" font-size="17">operand B   0 0 1 1     3</text><path d="M50 125H585" stroke="#9daf9e"/><text x="55" y="165" font-size="17">XOR         0 1 1 0     6</text><text x="55" y="212" font-size="14">Different bits become 1.</text></g></svg>