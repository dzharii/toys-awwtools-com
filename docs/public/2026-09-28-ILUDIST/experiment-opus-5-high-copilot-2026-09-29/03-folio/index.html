<!DOCTYPE html>
<html lang="en" data-app="folio">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>ILUD Folio — a card index for a cleared internet</title>
<meta name="description" content="A tray of index cards. Each one is a practical way to turn off, work around or replace an AI feature you did not ask for. Riffle through them, lift one out, use it.">
<meta name="theme-color" content="#15110d">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="ILUD Folio">
<meta property="og:description" content="A tray of index cards for using ordinary tools with less AI.">
<meta property="og:image" content="og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ILUD Folio">
<meta name="twitter:description" content="A tray of index cards for using ordinary tools with less AI.">
<meta name="twitter:image" content="og.jpg">
<link rel="stylesheet" href="folio.css">
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<!-- ─── splash ──────────────────────────────────────────────────── -->
<div class="splash" id="splash">
  <div class="splash__in">
    <div class="splash__cards" aria-hidden="true">
      <span class="sc sc--3"></span><span class="sc sc--2"></span>
      <span class="sc sc--1"><i>01</i></span>
    </div>
    <h1 class="splash__word">ILUD</h1>
    <p class="splash__sub">ILUDIST</p>
    <p class="splash__line">Tools for a cleared internet,<br>kept on cards.</p>
    <button class="splash__go" id="splashGo">Open the tray</button>
    <p class="splash__foot">Riffle · Lift · Use</p>
  </div>
</div>

<!-- ─── the tray ────────────────────────────────────────────────── -->
<main class="room" id="room" hidden>
  <header class="top">
    <div class="brand">
      <span class="brand__word">ILUD</span>
      <span class="brand__sub">ILUDIST</span>
    </div>
    <button class="sun" id="btnRiffle" aria-label="Shuffle to another remedy" title="Riffle">
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <g stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <path d="M16 3v6M16 23v6M3 16h6M23 16h6"/>
          <path d="m7 7 4.2 4.2M20.8 20.8 25 25M25 7l-4.2 4.2M11.2 20.8 7 25"/>
        </g>
        <circle cx="16" cy="16" r="4.6" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <section class="tray" id="tray">
    <div class="stack" id="stack" aria-live="polite"></div>
    <nav class="tabs" id="tabs" aria-label="Categories"></nav>
    <p class="deep" id="deep"></p>
  </section>

  <p class="hintline" id="hintline"><span>Swipe the card aside · tap it to read</span></p>

  <nav class="bar">
    <button class="barbtn" id="btnIndex">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.6" cy="10.6" r="6.2"/><path d="M15.2 15.2 21 21"/></svg>
      <span>Search</span>
    </button>
    <button class="barbtn" id="btnPocket">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.6 20.4V9.2l6.4-4.6 6.4 4.6v11.2Z"/><path d="M9.4 20.4v-5.2h5.2v5.2"/></svg>
      <span>Saved</span><i class="barbtn__n" id="pocketN" hidden>0</i>
    </button>
    <button class="barbtn" id="btnColophon">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v6M12 7.5v.8"/></svg>
      <span>Info</span>
    </button>
  </nav>
</main>

<!-- ─── the page (full record / index / pocket / colophon) ───────── -->
<div class="dim" id="dim" hidden></div>
<section class="page" id="page" hidden role="dialog" aria-modal="true" aria-label="Card details">
  <div class="page__grab" aria-hidden="true"></div>
  <header class="page__top">
    <p class="page__kicker" id="pageKicker">Card</p>
    <button class="page__x" id="pageX" aria-label="Put it back">
      <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg>
    </button>
  </header>
  <div class="page__body" id="pageBody"></div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="data.js"></script>
<script src="folio.js"></script>
<script src="stack.js"></script>
<script src="page.js"></script>
</body>
</html>
