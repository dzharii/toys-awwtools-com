<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b1d15"><title>The Workshop — ILUD</title><meta name="description" content="Choose a tool for a less mediated internet. Practical fixes organized like a well-stocked workshop.">
<link rel="canonical" href="https://toys.awwtools.com/public/2026-09-28-ILUDIST/06-workshop/"><meta property="og:type" content="website"><meta property="og:title" content="The Workshop — ILUD"><meta property="og:description" content="Choose a tool for a less mediated internet."><meta property="og:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/06-workshop/social.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/06-workshop/social.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="base.css">
<style>
:root{--bg:#281c14;--surface:#f2dfbc;--ink:#271d14;--muted:#725b46;--accent:#85562f;--line:#9c7e56}
body{background:repeating-linear-gradient(92deg,#302016 0 6px,#271b13 7px 17px);color:#f1dfbc}
.bench{max-width:980px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 15px calc(40px + env(safe-area-inset-bottom))}
.shelf-head{display:flex;justify-content:space-between;align-items:start}.shelf-head a{font:normal clamp(3.4rem,11vw,6.5rem)/1 Georgia,serif;color:#d5a670;text-decoration:none;letter-spacing:-.08em;text-shadow:0 3px 2px #000}.shelf-head small{display:block;font:10px Arial,sans-serif;letter-spacing:.32em;color:#c2a988}
.shelf-head button{background:#3a2719;color:#f7dfb7;border:1px solid #a27c52;padding:12px;min-height:48px}
.tagline{font:normal clamp(1.2rem,4vw,1.8rem) Georgia,serif;margin:25px 0;color:#e5cda7}
.rack{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:15px 5px 5px;scrollbar-color:#9a7047 #312017}
.tool{flex:1 0 115px;scroll-snap-align:center;min-height:196px;border:0;border-bottom:10px ridge #765331;background:linear-gradient(90deg,#443022,#5d3e25,#3a2619);color:#edcea3;display:flex;flex-direction:column;align-items:center;justify-content:end;gap:15px;padding:12px 6px;transition:transform .25s;position:relative}
.tool{animation:tool-in .45s ease both}@keyframes tool-in{from{opacity:.5;translate:0 15px}to{opacity:1;translate:0 0}}
.tool:hover,.tool[aria-pressed=true]{transform:translateY(-12px);background:linear-gradient(90deg,#5c3e26,#7b5734,#4e321f)}
.tool .shape{font:normal 3.2rem Georgia,serif;color:#e6b676;text-shadow:0 4px 8px #000}
.tool b{font:normal 1rem Georgia,serif}.tool[aria-pressed=true]::after{content:"";height:4px;background:#f4d08f;position:absolute;bottom:0;left:10%;right:10%;box-shadow:0 0 13px #f4d08f}
.shelf-edge{height:22px;background:linear-gradient(#936a3e,#422916 60%,#1b100c);border:1px solid #ad8152;box-shadow:0 17px 20px #0008}
.work-card{margin:45px auto 25px;max-width:820px;background:#ebd7b1;color:#211811;padding:clamp(20px,5vw,40px);border:9px ridge #785737;box-shadow:0 20px 45px #000b;min-height:330px;animation:rise .45s ease}
@keyframes rise{from{transform:translateY(15px);opacity:.4}to{transform:translateY(0);opacity:1}}
.work-card .eyebrow{color:#7b4d2b}.work-card h1{font:normal clamp(2.3rem,7vw,4.3rem)/1 Georgia,serif;letter-spacing:-.05em;margin:15px 0}.work-card p{font:normal 1.2rem/1.45 Georgia,serif;color:#5f4a39;max-width:550px}
.work-card button{min-height:52px;padding:12px 20px;background:#694026;color:#ffe8c7;border:0;font:normal 1.1rem Georgia,serif}
.more{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.more button{background:transparent;border:1px solid #8e755e;color:#523b28;font-size:.85rem;min-height:46px}
.bench-actions{display:flex;justify-content:space-between;gap:12px}.bench-actions button{min-height:48px;padding:9px 14px;background:none;border:1px solid #a57f55;color:#f0d5ad}
.ilud-dialog{--surface:#ebdbbc;--ink:#281c13;--muted:#6a5541;--accent:#7a4728;--line:#a78a68;color-scheme:light}
@media(max-width:520px){.tool{flex-basis:105px;min-height:155px}.tool .shape{font-size:2.8rem}.tagline{margin-top:18px}}
</style></head><body><main class="bench"><header class="shelf-head"><div><a href="../">ILUD</a><small>THE WORKSHOP / 06</small></div><button data-saved>☆ SAVED FIXES</button></header><p class="tagline">Pick a tool for a clearer internet.</p>
<section aria-label="Tool rack" class="rack" id="rack"></section><div class="shelf-edge" aria-hidden="true"></div>
<section class="work-card" id="work-card" aria-live="polite"></section><nav class="bench-actions"><button data-browse>Search every tool ⌕</button><button id="category-all">See all in category →</button></nav></main>
<script src="catalog.js"></script><script src="core.js"></script><script>
ILUD.init();const tools=[["Search","⌕"],["Social","♧"],["Writing","✎"],["Images","▣"],["Video","▷"],["Everyday","◇"]];let chosen="Search";
document.getElementById("rack").innerHTML=tools.map(([cat,symbol])=>`<button type="button" class="tool" data-tool="${cat}" aria-pressed="${cat===chosen}"><span class="shape" aria-hidden="true">${symbol}</span><b>${cat}</b></button>`).join("");
function render(){const matches=ILUD.entries.filter(e=>e.category===chosen),featured=matches[0];const card=document.getElementById("work-card");card.style.animation="none";card.offsetHeight;card.style.animation="";card.innerHTML=`<span class="eyebrow">INSTRUMENT / ${chosen.toUpperCase()}</span><h1>${featured.title}</h1><p>${featured.summary}</p><button data-open="${featured.id}">Use this tool →</button><div class="more">${matches.slice(1,4).map(e=>`<button data-open="${e.id}">${e.title} ↗</button>`).join("")}</div>`;document.querySelectorAll(".tool").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.tool===chosen)))}
document.getElementById("rack").addEventListener("click",e=>{const tool=e.target.closest("[data-tool]");if(tool){chosen=tool.dataset.tool;render()}});
document.getElementById("category-all").onclick=()=>ILUD.openBrowse(chosen);render();
</script></body></html>
