<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1d20"><title>The Atlas — ILUD</title><meta name="description" content="Explore a map of practical paths to a less AI-mediated everyday internet.">
<link rel="canonical" href="https://toys.awwtools.com/public/2026-09-28-ILUDIST/05-atlas/"><meta property="og:type" content="website"><meta property="og:title" content="The Atlas — ILUD"><meta property="og:description" content="Explore a map of practical paths to a quieter web."><meta property="og:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/05-atlas/social.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/05-atlas/social.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="base.css">
<style>
:root{--bg:#0b1b1d;--surface:#182a28;--ink:#eedec1;--muted:#a5b9ac;--accent:#e7b67e;--line:#547575}
body{background:repeating-radial-gradient(ellipse at 40% 40%,#0e2224 0 5px,#0c1a1d 6px 12px)}
.atlas{max-width:1100px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 17px calc(40px + env(safe-area-inset-bottom))}
.atlas-head{display:flex;align-items:center;justify-content:space-between}.atlas-head a{font:normal 3.5rem Georgia,serif;letter-spacing:-.1em;text-decoration:none;color:var(--accent)}.atlas-head button{border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:48px;padding:9px 15px;border-radius:22px}
.atlas h1{font:normal clamp(1.8rem,5vw,3.2rem)/1 Georgia,serif;margin:20px 0 5px}.atlas>p{color:var(--muted);line-height:1.5}
.chart{position:relative;min-height:700px;margin:22px auto;border:1px solid #4f6c65;border-radius:49% 51% 40% 50% / 7% 13% 9% 8%;background:radial-gradient(ellipse at 49% 53%,#a78055 0 8%,#453c2b 9% 13%,transparent 14%),radial-gradient(ellipse at 19% 25%,#516b47 0 14%,#a17c52 16% 19%,transparent 20%),radial-gradient(ellipse at 79% 24%,#765f48 0 11%,#a17c52 13% 16%,transparent 17%),radial-gradient(ellipse at 19% 74%,#617056 0 12%,#9e8459 14% 17%,transparent 18%),radial-gradient(ellipse at 78% 75%,#6d755b 0 13%,#9e8459 15% 18%,transparent 19%),radial-gradient(ellipse at 49% 13%,#846747 0 6%,#a17c52 8% 10%,transparent 11%),repeating-radial-gradient(ellipse at 50% 50%,#102528 0 5px,#193436 6px 10px);overflow:hidden;box-shadow:0 17px 50px #0009}
.chart{animation:reveal-chart .6s ease both}@keyframes reveal-chart{from{opacity:.5;filter:brightness(.6)}to{opacity:1;filter:brightness(1)}}
.chart::after{content:"";position:absolute;inset:20px;border:1px dashed #d3b47c63;border-radius:48%;pointer-events:none}
.island{position:absolute;z-index:2;border:1px solid #dcc294;background:#152321d9;color:var(--ink);padding:10px 12px;min-width:105px;border-radius:40px;box-shadow:0 6px 20px #000a;transition:transform .2s,background .2s}
.island:hover,.island[aria-pressed=true]{transform:translateY(-6px);background:#695036}.island span{display:block;font-size:1.25rem}.island b{font:normal 1.05rem Georgia,serif}
.island[data-category=Search]{top:19%;left:13%}.island[data-category=Social]{top:17%;right:11%}.island[data-category=Images]{top:49%;right:7%}.island[data-category=Writing]{top:47%;left:8%}.island[data-category=Video]{bottom:13%;left:17%}.island[data-category=Everyday]{bottom:13%;right:11%}
.compass{position:absolute;top:43%;left:41%;width:18%;aspect-ratio:1;border:1px solid #e8b47a;border-radius:50%;display:grid;place-items:center;font:normal clamp(1rem,3vw,2rem) Georgia,serif;color:#f3d4aa;text-shadow:0 2px 6px #000}
.drawer{border:1px solid var(--line);border-radius:15px;background:#142523;padding:19px;box-shadow:0 15px 40px #0009;min-height:195px}
.drawer-head{display:flex;align-items:center;justify-content:space-between}.drawer h2{font:normal 2rem Georgia,serif;margin:5px 0}.drawer button.all{border:1px solid var(--accent);color:var(--accent);background:transparent;min-height:44px;padding:8px 12px}
.drawer-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.drawer-grid button{text-align:left;min-height:70px;padding:12px;border:1px solid var(--line);background:#21332e;color:var(--ink);font:normal 1rem Georgia,serif}.drawer-grid button:hover{border-color:var(--accent)}
.chart-note{font:11px Arial,sans-serif;letter-spacing:.12em;color:var(--muted)}
@media(max-width:600px){.chart{min-height:650px}.island{min-width:0;padding:9px 11px}.island b{font-size:.92rem}.island[data-category=Writing]{left:2%}.island[data-category=Images]{right:2%}.compass{left:40%;width:20%}.drawer-grid{grid-template-columns:1fr 1fr}}
</style></head><body><main class="atlas"><header class="atlas-head"><a href="../">ILUD</a><button data-browse>Search the atlas ⌕</button></header><h1>Where shall we go?</h1><p>Tap an island to uncover useful routes through the ordinary web.</p>
<section class="chart" aria-label="Explore categories as islands"><button class="island" data-category="Search" aria-pressed="true"><span>⌕</span><b>Search</b></button><button class="island" data-category="Social" aria-pressed="false"><span>♧</span><b>Social</b></button><button class="island" data-category="Images" aria-pressed="false"><span>▣</span><b>Images</b></button><button class="island" data-category="Writing" aria-pressed="false"><span>✎</span><b>Writing</b></button><button class="island" data-category="Video" aria-pressed="false"><span>▷</span><b>Video</b></button><button class="island" data-category="Everyday" aria-pressed="false"><span>◇</span><b>Everyday</b></button><div class="compass" aria-hidden="true">✦<br>ILUD</div></section>
<section class="drawer" aria-live="polite"><div class="drawer-head"><div><span class="eyebrow">CHART / 05</span><h2 id="place">Search island</h2></div><button class="all" id="all">All routes ↗</button></div><div id="routes" class="drawer-grid"></div></section><p class="chart-note">No coordinates or location permission needed · <button data-saved style="color:inherit;background:none;border:0;text-decoration:underline;min-height:44px">Saved routes</button></p></main>
<script src="catalog.js"></script><script src="core.js"></script><script>
ILUD.init();let category="Search";function render(){document.getElementById("place").textContent=category+" island";document.getElementById("routes").innerHTML=ILUD.entries.filter(e=>e.category===category).slice(0,6).map(e=>`<button data-open="${e.id}">${e.symbol} ${e.title} ↗</button>`).join("");document.querySelectorAll(".island").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.category===category)))}
document.querySelectorAll(".island").forEach(b=>b.addEventListener("click",()=>{category=b.dataset.category;render();if(window.innerWidth<601)document.querySelector(".drawer").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth",block:"nearest"})}));
document.getElementById("all").onclick=()=>ILUD.openBrowse(category);render();
</script></body></html>
