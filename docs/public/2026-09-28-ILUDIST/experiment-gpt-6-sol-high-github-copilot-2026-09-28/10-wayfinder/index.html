<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12100f"><title>The Wayfinder — ILUD</title><meta name="description" content="Tell the wayfinder what is bothering you and discover a practical route to a quieter internet.">
<link rel="canonical" href="https://toys.awwtools.com/public/2026-09-28-ILUDIST/10-wayfinder/"><meta property="og:type" content="website"><meta property="og:title" content="The Wayfinder — ILUD"><meta property="og:description" content="Tell the wayfinder what bothers you. Find a route."><meta property="og:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/10-wayfinder/social.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/10-wayfinder/social.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="base.css">
<style>
:root{--bg:#11100f;--surface:#201e1d;--ink:#f1e3d5;--muted:#b6a8a1;--accent:#dba87b;--line:#765747}
body{background:radial-gradient(ellipse at 50% 0,#2d2928,#12100f 70%)}
.way{max-width:800px;margin:auto;min-height:100svh;padding:calc(20px + env(safe-area-inset-top)) 18px calc(45px + env(safe-area-inset-bottom));position:relative}
.way::before{content:"";position:absolute;inset:50px 14px 0;border:1px solid #89654944;border-radius:48% 48% 5px 5px / 140px 140px 5px 5px;pointer-events:none}
.way header{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1}.way header a{font:normal 4rem Georgia,serif;color:var(--accent);text-decoration:none;letter-spacing:-.09em}.way header button{min-height:48px;color:var(--ink);background:none;border:1px solid var(--line);padding:9px 14px}
.orb{margin:42px auto 12px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#f8d7aa,#c78f62 40%,#624939 78%);box-shadow:0 0 35px #e6a67580;animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-9px)}}
.way h1{text-align:center;font:normal clamp(2.7rem,7vw,4.9rem)/1.03 Georgia,serif;max-width:690px;margin:20px auto 13px;letter-spacing:-.045em}
.way>p{text-align:center;color:var(--muted);font:1.1rem/1.4 Georgia,serif}
.progress{display:flex;justify-content:center;gap:10px;margin:34px 0 23px}.progress span{height:3px;width:44px;background:#705e55}.progress span.active{background:var(--accent);box-shadow:0 0 12px var(--accent)}
.prompt{position:relative;z-index:1;max-width:650px;margin:auto}.prompt h2{font:normal 1.45rem Georgia,serif;text-align:center;margin:14px 0 19px}
.prompt{animation:arrive .45s ease both}@keyframes arrive{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}
.options{display:grid;gap:10px}.options button{width:100%;text-align:left;min-height:75px;border:1px solid var(--line);background:#24201f;color:var(--ink);padding:16px 22px;border-radius:40px;display:flex;align-items:center;justify-content:space-between;font:normal 1.23rem Georgia,serif;transition:transform .2s,border .2s}
.options button:hover{transform:translateX(5px);border-color:var(--accent)}.options button span{color:var(--accent)}
.return{display:flex;justify-content:space-between;gap:8px;max-width:650px;margin:25px auto}.return button{background:none;color:var(--muted);border:0;min-height:46px;text-decoration:underline}
.recommend{padding:26px;border:1px solid var(--accent);background:radial-gradient(at top,#3e2f2b,#201b1b);border-radius:17px;box-shadow:0 0 35px #d9ab7c22}
.recommend h2{text-align:left;font:normal clamp(2rem,6vw,3rem)/1 Georgia,serif}.recommend p{color:var(--muted);line-height:1.5}
.recommend .go{background:var(--accent);color:#23170e;padding:13px 23px;border:0;border-radius:30px;min-height:54px}
.recommend .secondary{background:none;border:1px solid var(--line);color:var(--ink);min-height:48px;padding:11px;margin-top:12px}
</style></head><body><main class="way"><header><a href="../">ILUD</a><button data-saved>Saved ☆</button></header><div class="orb" aria-hidden="true"></div><h1>What is bothering you?</h1><p>A small choice can make your everyday web feel like yours again.</p><div class="progress" id="progress" aria-label="Progress: step 1 of 3"><span class="active"></span><span></span><span></span></div>
<section class="prompt" id="prompt" aria-live="polite"></section><nav class="return"><button id="back">← Back</button><button data-browse>Browse all routes ⌕</button></nav></main>
<script src="catalog.js"></script><script src="core.js"></script><script>
ILUD.init();let step=0,category=null,preference=null;const labels={Search:"Finding information",Social:"Seeing other people's posts",Images:"Finding images",Writing:"Putting words on a page",Video:"Watching something",Everyday:"Everyday essentials"};
function recommend(){const list=ILUD.entries.filter(e=>e.category===category),matching=list.filter(e=>e.kind===preference && (category!=="Writing"||e.id!=="firefox-reader"));return {entry:matching[0]||list.find(e=>e.kind==="alternative")||list[0],exact:!!matching.length}}
function render(){document.querySelectorAll("#progress span").forEach((s,i)=>s.classList.toggle("active",i<=step));document.getElementById("progress").setAttribute("aria-label",`Progress: step ${step+1} of 3`);document.getElementById("back").hidden=step===0;const host=document.getElementById("prompt");
if(step===0)host.innerHTML=`<h2>What are you trying to do?</h2><div class="options">${Object.entries(labels).map(([key,label])=>`<button data-choice="${key}">${label}<span>↗</span></button>`).join("")}</div>`;
if(step===1)host.innerHTML=`<h2>How would you like to handle ${category.toLowerCase()}?</h2><div class="options"><button data-preference="setting">Keep my usual tool, if I can<span>↗</span></button><button data-preference="workaround">Take a different route<span>↗</span></button><button data-preference="alternative">Show me another tool<span>↗</span></button></div>`;
if(step===2){const {entry:e,exact}=recommend();host.innerHTML=`<div class="recommend"><span class="eyebrow">A ROUTE FOR YOU / ${category.toUpperCase()}</span><h2>${e.title}</h2><p>${e.summary}</p>${exact?"":'<p>No verified route of that kind is listed here yet; this is the closest alternative.</p>'}<button class="go" data-open="${e.id}">See how it works →</button><br><button class="secondary" data-browse="${category}">Compare all ${category.toLowerCase()} routes ↗</button></div>`}}
document.getElementById("prompt").addEventListener("click",e=>{const choice=e.target.closest("[data-choice]"),kind=e.target.closest("[data-preference]");if(choice){category=choice.dataset.choice;step=1;render()}if(kind){preference=kind.dataset.preference;step=2;render()}});
document.getElementById("back").onclick=()=>{step=Math.max(0,step-1);render()};render();
</script></body></html>
