.map{position:relative;min-height:1000px;isolation:isolate}
.map svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;overflow:visible}

.map path:nth-child(2){stroke:#8aa89e;animation-delay:.25s}.map path:nth-child(3){stroke:#879ab4;animation-delay:.4s}.map path:nth-child(4){stroke:#d5b77e;animation-delay:.6s}
@keyframes trace{to{stroke-dashoffset:0}}
.branch{position:absolute;display:block;text-align:left;min-width:145px;max-width:210px;padding:12px 14px;background:#0d1514ee;color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 25px #0006;transition:transform .2s,border .2s}
.branch:hover,.branch:focus-visible,.branch.active{transform:translateY(-4px);border-color:var(--accent)}
.branch::before{content:"";position:absolute;left:-17px;top:16px;width:12px;height:12px;background:var(--bg);border:3px solid var(--accent);border-radius:50%;box-shadow:0 0 0 4px #d9ae7560}

.station{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:175px;height:175px;border:1px solid var(--accent);border-radius:50%;display:grid;place-content:center;text-align:center;background:#15211ee8;box-shadow:0 0 0 12px #bfa07716,0 0 50px #d4ad7630}
.station span{color:var(--accent);font-size:2rem}.station b{font:normal 1.65rem Georgia,serif}.station small{font:10px Arial,sans-serif;letter-spacing:.18em;color:var(--muted)}
.map-caption{position:absolute;bottom:10px;left:10px;font:10px/1.6 Arial,sans-serif;color:var(--muted);letter-spacing:.2em;text-transform:uppercase}

@media(max-width:520px){.map{min-height:920px}.branch{min-width:0;width:41%;padding:12px 9px}.branch b{font-size:1.1rem}.branch:nth-of-type(1),.branch:nth-of-type(3),.branch:nth-of-type(5){left:8%}.branch:nth-of-type(2),.branch:nth-of-type(4),.branch:nth-of-type(6){right:0}.station{width:120px;height:120px;top:48%}.station b{font-size:1.15rem}.branch::before{left:-11px;width:8px;height:8px}}
