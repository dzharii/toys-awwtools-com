<style>

body{background:var(--bg)}
.edition{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) 130px;min-height:100svh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.page{padding:28px clamp(24px,5vw,75px) 90px}

.edition-head{animation:imprint .55s ease both}@keyframes imprint{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.wordmark{font:normal clamp(4rem,12vw,9rem)/.8 Georgia,serif;letter-spacing:-.09em;color:var(--accent);text-decoration:none}
.edition-head p{writing-mode:vertical-rl;font:10px/1.5 Arial,sans-serif;letter-spacing:.3em;text-transform:uppercase}
.issue{font:italic 1.5rem Georgia,serif;color:var(--accent);margin:52px 0 15px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:24px;align-items:end}
.hero h1{font:normal clamp(3.6rem,8vw,7.8rem)/.89 Georgia,serif;letter-spacing:-.075em;margin:0}
.hero h1 em{color:var(--accent);font-weight:normal}
.arch{height:400px;border-radius:52% 52% 0 0;background:radial-gradient(ellipse at 67% 40%,#ccab86 0 11%,#6d302c 12% 38%,#2a1817 40% 65%,#bc8b70 66% 75%,#e6d6c4 77%);box-shadow:inset 12px 0 18px #120e0c75}
.lede{font:normal clamp(1.35rem,3vw,2rem)/1.3 Georgia,serif;max-width:590px;margin:26px 0}
.hero-action{background:var(--accent);color:var(--surface);border:0;min-height:58px;padding:16px 28px;font:1.1rem Georgia,serif}
.section-label{font:700 11px Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin:75px 0 10px}
.feature{display:flex;align-items:center;gap:20px;text-align:left;width:100%;padding:25px 0;background:none;color:var(--ink);border:0;border-top:1px solid var(--line)}
.feature:last-of-type{border-bottom:1px solid var(--line)}
.feature span:first-child{font:italic 1.4rem Georgia,serif;color:var(--accent);align-self:flex-start}
.feature strong{font:normal clamp(1.6rem,4vw,2.7rem)/1 Georgia,serif;flex:1;letter-spacing:-.04em}
.feature small{font:12px Arial,sans-serif;color:var(--muted);max-width:130px}
.feature:hover strong{text-decoration:underline;text-decoration-thickness:1px}
.rail{border-left:1px solid var(--line);position:sticky;top:0;height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:space-evenly;padding:15px 2px}
.rail button{border:0;background:none;color:var(--ink);display:grid;gap:10px;justify-items:center;min-width:65px;min-height:48px}
.rail button span{font:italic 1.3rem Georgia,serif;color:var(--accent)}.rail button small{font:13px Georgia,serif}
.rail button:hover small{text-decoration:underline}
.footer-actions{display:flex;gap:20px;margin-top:30px}.footer-actions button{border:1px solid var(--ink);background:none;padding:13px 17px;color:var(--ink);min-height:48px}
@media(max-width:660px){.edition{grid-template-columns:minmax(0,1fr) 69px}.page{padding:22px 20px 90px}.hero{display:flex;flex-direction:column}.hero h1{font-size:clamp(3.25rem,13vw,5rem)}.arch{width:100%;height:155px;opacity:.9}.rail button small{font-size:10px;writing-mode:vertical-rl}.feature small{display:none}.feature strong{font-size:1.55rem}}
