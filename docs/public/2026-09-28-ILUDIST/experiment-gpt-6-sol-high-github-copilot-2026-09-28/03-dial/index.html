<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#11100e"><title>The Dial — ILUD</title><meta name="description" content="Turn the dial to find a practical way to use everyday tools with less unwanted AI.">
<link rel="canonical" href="https://toys.awwtools.com/public/2026-09-28-ILUDIST/03-dial/"><meta property="og:type" content="website"><meta property="og:title" content="The Dial — ILUD"><meta property="og:description" content="Turn the dial to find a practical way to use everyday tools with less unwanted AI."><meta property="og:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/03-dial/social.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/03-dial/social.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="base.css">
<style>
:root{--bg:#12110f;--surface:#211d17;--ink:#ead7b8;--muted:#b5a184;--accent:#d8ab71;--line:#74583c}
body{background:repeating-linear-gradient(80deg,#171511,#171511 2px,#14120f 3px,#14120f 7px)}
.instrument{max-width:720px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px calc(50px + env(safe-area-inset-bottom));min-height:100svh;text-align:center}
.hardware{border:1px solid #8f6b43;border-radius:24px;padding:25px 17px 40px;box-shadow:inset 0 0 0 4px #1b1915,inset 0 0 0 5px #614830,0 20px 70px #000}
.topline{display:flex;justify-content:space-between;align-items:center}.topline a{color:var(--accent);font:normal 2.5rem Georgia,serif;letter-spacing:.07em;text-decoration:none}.topline button{background:none;color:var(--muted);border:1px solid var(--line);padding:8px;border-radius:50%;width:46px;height:46px}
.subtitle{font:10px Arial,sans-serif;letter-spacing:.4em;color:var(--muted);margin:2px 0 28px}
.pointer{color:var(--accent);font-size:2rem;line-height:1}
.wheel-wrap{position:relative;width:min(84vw,440px);aspect-ratio:1;margin:0 auto 34px;touch-action:none}
.wheel{width:100%;height:100%;border:12px ridge #745430;border-radius:50%;position:relative;background:repeating-conic-gradient(from -30deg,#201c16 0deg 58deg,#5f442b 59deg 60deg);box-shadow:inset 0 0 0 3px #c49a62,inset 0 0 25px #000,0 5px 20px #000;transition:transform .3s cubic-bezier(.21,.87,.38,1.16);user-select:none;cursor:grab}
.wheel{animation:settle .6s ease both}@keyframes settle{from{opacity:.4;filter:brightness(.7)}to{opacity:1;filter:brightness(1)}}
.wheel:active{cursor:grabbing}
.wheel-label{position:absolute;width:30%;left:35%;top:35%;height:30%;display:grid;place-content:center;text-shadow:0 2px 4px #000;font:normal clamp(.7rem,2.7vw,1.1rem) Georgia,serif;pointer-events:none}
.wheel-label span{font-size:1.5rem;color:var(--accent)}
.wheel-label:nth-child(1){transform:translateY(-116%)}.wheel-label:nth-child(2){transform:rotate(60deg) translateY(-116%) rotate(-60deg)}.wheel-label:nth-child(3){transform:rotate(120deg) translateY(-116%) rotate(-120deg)}.wheel-label:nth-child(4){transform:rotate(180deg) translateY(-116%) rotate(-180deg)}.wheel-label:nth-child(5){transform:rotate(240deg) translateY(-116%) rotate(-240deg)}.wheel-label:nth-child(6){transform:rotate(300deg) translateY(-116%) rotate(-300deg)}
.hub{position:absolute;inset:31%;border-radius:50%;border:2px solid var(--accent);background:radial-gradient(circle,#35291e,#12110f);display:grid;place-content:center;font:11px/1.6 Arial,sans-serif;letter-spacing:.12em;color:var(--muted);box-shadow:0 0 0 8px #100e0a}
.screen{border:1px solid var(--line);border-radius:10px;padding:24px 18px;max-width:500px;margin:auto;background:#191611;box-shadow:inset 0 2px 13px #000}
.screen h1{font:normal clamp(1.8rem,7vw,3rem)/1.1 Georgia,serif;margin:12px 0}.screen p{color:var(--muted);line-height:1.5}
.launch{display:block;width:100%;border:1px solid #e8ca9e;background:linear-gradient(#e9c693,#ad7849);color:#1d130e;padding:15px;font:600 1.1rem Georgia,serif;border-radius:40px;min-height:54px}
.steppers{display:flex;justify-content:space-between;gap:14px;max-width:500px;margin:15px auto}
.steppers button{flex:1;min-height:48px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:6px}
.bottom{display:flex;justify-content:center;gap:16px;margin-top:16px}.bottom button{border:0;background:none;color:var(--muted);min-height:44px;text-decoration:underline}
@media(max-width:380px){.wheel{border-width:8px}.wheel-label{font-size:.72rem}.wheel-label span{font-size:1.1rem}}
</style></head><body>
<main class="instrument"><div class="hardware"><div class="topline"><button data-browse aria-label="Browse all routes">⌕</button><a href="../">ILUD</a><button data-saved aria-label="Saved routes">☆</button></div><p class="subtitle">THE DIAL / 03</p>
<div class="pointer" aria-hidden="true">▲</div><div class="wheel-wrap" aria-label="Drag the dial or use the buttons below to choose a category"><div class="wheel" id="wheel">
<div class="wheel-label">⌕<br>Search</div><div class="wheel-label">♧<br>Social</div><div class="wheel-label">▣<br>Images</div><div class="wheel-label">✎<br>Writing</div><div class="wheel-label">▷<br>Video</div><div class="wheel-label">◇<br>Everyday</div></div><div class="hub" aria-hidden="true">WHAT DO YOU<br>WANT LESS OF?</div></div>
<section class="screen" aria-live="polite"><span id="number" class="eyebrow">01 / SEARCH</span><h1 id="pick-title">Search with less AI</h1><p id="pick-summary">Find ordinary web results again.</p><button class="launch" id="launch">Explore Search →</button></section>
<div class="steppers"><button id="previous" aria-label="Previous category">← Previous</button><button id="next" aria-label="Next category">Next →</button></div><div class="bottom"><button id="sound" aria-pressed="false">Sound off</button><button data-browse>All routes</button></div></div></main>
<script src="catalog.js"></script><script src="core.js"></script><script>
ILUD.init();
const categories=[["Search","Search with less AI","Find ordinary web results again."],["Social","Your chosen communities","Replace recommendations with people you follow."],["Images","Find more human work","Discover images with clearer provenance."],["Writing","Keep your own voice","A calmer space to think and write."],["Video","Choose what plays next","Follow creators rather than an endless feed."],["Everyday","Everyday essentials","Maps, weather, reference and more."]];
let index=0,angle=0,down=null,audio=null,sound=false;
const wheel=document.getElementById("wheel");
function clickSound(){if(!sound)return;audio ||= new (window.AudioContext||window.webkitAudioContext)();if(audio.state==="suspended")audio.resume().catch(error=>{console.error("Sound could not start",error);sound=false;document.getElementById("sound").textContent="Sound unavailable";document.getElementById("sound").setAttribute("aria-pressed","false")});const osc=audio.createOscillator(),gain=audio.createGain();osc.type="sine";osc.frequency.value=540;gain.gain.setValueAtTime(.017,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.055);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+.06)}
function select(n){index=(n+categories.length)%categories.length;angle=-index*60;wheel.style.transform=`rotate(${angle}deg)`;document.getElementById("number").textContent=`0${index+1} / ${categories[index][0].toUpperCase()}`;document.getElementById("pick-title").textContent=categories[index][1];document.getElementById("pick-summary").textContent=categories[index][2];document.getElementById("launch").textContent=`Explore ${categories[index][0]} →`;clickSound()}
document.getElementById("previous").onclick=()=>select(index-1);document.getElementById("next").onclick=()=>select(index+1);
document.getElementById("launch").onclick=()=>ILUD.openBrowse(categories[index][0]);
document.getElementById("sound").onclick=(event)=>{if(!window.AudioContext&&!window.webkitAudioContext){event.currentTarget.textContent="Sound unavailable";event.currentTarget.disabled=true;return}sound=!sound;event.currentTarget.textContent=sound?"Sound on":"Sound off";event.currentTarget.setAttribute("aria-pressed",String(sound));if(sound)clickSound()};
wheel.addEventListener("pointerdown",(event)=>{down={x:event.clientX,y:event.clientY,index};wheel.setPointerCapture(event.pointerId)});
wheel.addEventListener("pointermove",(event)=>{if(!down)return;const diff=event.clientX-down.x;wheel.style.transition="none";wheel.style.transform=`rotate(${-down.index*60+diff*.55}deg)`});
wheel.addEventListener("pointerup",(event)=>{if(!down)return;wheel.style.transition="";const diff=event.clientX-down.x;select(down.index-Math.round(diff/85));down=null});
wheel.addEventListener("pointercancel",()=>{down=null;select(index)});
</script></body></html>
