<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17120f"><title>The Folio — ILUD</title><meta name="description" content="A tactile folio of practical routes through the everyday internet, with less unwanted AI.">
<link rel="canonical" href="https://toys.awwtools.com/public/2026-09-28-ILUDIST/04-folio/"><meta property="og:type" content="website"><meta property="og:title" content="The Folio — ILUD"><meta property="og:description" content="A tactile folio of practical routes."><meta property="og:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/04-folio/social.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/04-folio/social.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="base.css">
<style>
:root{--bg:#1a1511;--surface:#e9dac1;--ink:#2a2019;--muted:#665245;--accent:#773a32;--line:#b39675}
body{background:radial-gradient(circle at 50% 0,#38291e,#17120f 65%);color:#f5e1bf}
.desk{max-width:770px;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(50px + env(safe-area-inset-bottom));min-height:100svh}
.head{display:flex;align-items:center;justify-content:space-between;padding-bottom:28px}
.head a{font:normal 3.4rem/.9 Georgia,serif;letter-spacing:-.09em;color:#e5b983;text-decoration:none}
.head small{display:block;font:10px Arial,sans-serif;letter-spacing:.34em;color:#bfa48b}
.head button,.bottom button{color:#efddc3;border:1px solid #785a40;background:transparent;min-height:46px;padding:9px 13px}
.instruction{font:italic 1.15rem Georgia,serif;color:#cdb595;margin:0 0 28px}
.binder{border:2px solid #866244;border-radius:10px;padding:16px 16px 32px;background:repeating-linear-gradient(95deg,#2e2019,#36261c 5px,#33241c 9px);box-shadow:0 20px 55px #000a;position:relative}
.binder{animation:place .45s ease both}@keyframes place{from{transform:translateY(16px) rotate(-1deg);opacity:.5}to{transform:none;opacity:1}}
.tabs{display:flex;gap:3px;overflow-x:auto;padding:0 0 16px;scrollbar-width:thin}
.tabs button{white-space:nowrap;background:#bb9a76;color:#2a1e14;border:0;border-radius:6px 6px 0 0;padding:12px 13px;min-height:48px;font:600 .8rem Georgia,serif}
.tabs button[aria-selected=true]{background:#f0e2cc;color:#6c312d}
.stack{height:500px;position:relative;perspective:950px}
.under{position:absolute;inset:22px 7px -18px 7px;background:#a88165;border:1px solid #593c2e;border-radius:8px;transform:rotate(-2deg)}
.under::after{content:"";position:absolute;inset:7px;background:#d8bd98;border-radius:5px}
.paper{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#f7ebd9,#e8d5b7 80%);color:#221911;border:1px solid #806e5c;border-radius:10px;padding:clamp(23px,5vw,42px);box-shadow:0 11px 23px #0009;touch-action:pan-y;transition:transform .3s,opacity .3s;display:flex;flex-direction:column;user-select:none}
.paper.swipe{transform:translateX(110%) rotate(12deg);opacity:0}
.paper .meta{font:700 .7rem Arial,sans-serif;letter-spacing:.2em;color:#784d3b;border-bottom:1px solid #ac8a72;padding-bottom:22px}
.paper h1{font:normal clamp(2.5rem,8vw,5.3rem)/.98 Georgia,serif;letter-spacing:-.065em;margin:45px 0 18px}
.paper>p{font:normal clamp(1.1rem,3vw,1.45rem)/1.4 Georgia,serif;max-width:540px}
.paper footer{display:flex;align-items:center;gap:12px;margin-top:auto;flex-wrap:wrap}
.paper footer button{min-height:52px;border-radius:6px;padding:13px 20px;background:#6d302c;color:#fff1db;border:1px solid #9a684f}
.paper footer small{color:#6b594c;font:12px Arial,sans-serif}
.ring{position:absolute;top:55px;left:-5px;width:22px;height:22px;background:#2c1c15;border:5px ridge #bd9661;border-radius:50%;box-shadow:0 0 5px #000}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:30px 0 0}
.page-count{font:11px Arial,sans-serif;letter-spacing:.18em;color:#c6a27c}
.bottom button{border-radius:5px}
.ilud-dialog{--surface:#f1e6d4;--ink:#251a14;--muted:#66584b;--accent:#7b3d2d;--line:#b7a68e;color-scheme:light}
@media(max-width:430px){.stack{height:520px}.paper h1{margin-top:35px}.paper{padding:23px}.bottom{gap:5px}.bottom button{padding:8px;font-size:.78rem}}
</style></head><body><main class="desk"><header class="head"><div><a href="../">ILUD</a><small>THE FOLIO / 04</small></div><button data-browse aria-label="Search the folio">SEARCH ⌕</button></header>
<p class="instruction">Choose a tab. Turn a page. Keep what works.</p>
<div class="binder"><div class="tabs" id="tabs" role="tablist" aria-label="Folio sections"></div><div class="stack">
<div class="under" aria-hidden="true"></div><article id="paper" class="paper" role="tabpanel" aria-live="polite"></article><span class="ring" aria-hidden="true"></span></div></div>
<nav class="bottom" aria-label="Folio controls"><button id="back">← Previous</button><span id="count" class="page-count"></span><button id="forward">Next →</button><button data-saved aria-label="Saved routes">☆</button></nav></main>
<script src="catalog.js"></script><script src="core.js"></script><script>
ILUD.init();const sections=["Search","Social","Images","Writing","Video","Everyday"];let section="Search",position=0,startX=null;
const paper=document.getElementById("paper"),tabs=document.getElementById("tabs");
tabs.innerHTML=sections.map(c=>`<button type="button" role="tab" data-section="${c}" aria-selected="${c===section}">${c}</button>`).join("");
function pages(){return ILUD.entries.filter(e=>e.category===section)}
function render(){const e=pages()[position];paper.innerHTML=`<span class="meta">FIELD NOTE ${String(position+1).padStart(2,"0")} / ${section.toUpperCase()}</span><h1>${e.title}</h1><p>${e.summary}</p><footer><button type="button" data-open="${e.id}">Use this route →</button><small>${e.type} · Source checked ${e.checked}</small></footer>`;document.getElementById("count").textContent=`${position+1} / ${pages().length}`;tabs.querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.section===section)))}
function turn(direction){paper.classList.add("swipe");setTimeout(()=>{position=(position+direction+pages().length)%pages().length;render();paper.classList.remove("swipe")},180)}
tabs.addEventListener("click",e=>{const tab=e.target.closest("[data-section]");if(tab){section=tab.dataset.section;position=0;render()}});
document.getElementById("forward").onclick=()=>turn(1);document.getElementById("back").onclick=()=>turn(-1);
paper.addEventListener("pointerdown",e=>{startX=e.clientX});paper.addEventListener("pointerup",e=>{if(startX!==null&&Math.abs(e.clientX-startX)>65)turn(e.clientX<startX?1:-1);startX=null});
render();
</script></body></html>
