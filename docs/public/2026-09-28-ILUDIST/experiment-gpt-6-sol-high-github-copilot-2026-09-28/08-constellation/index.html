<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10151a"><title>The Constellation — ILUD</title><meta name="description" content="Start with what bothers you. Follow a branching constellation to a practical way forward.">
<link rel="canonical" href="https://toys.awwtools.com/public/2026-09-28-ILUDIST/08-constellation/"><meta property="og:type" content="website"><meta property="og:title" content="The Constellation — ILUD"><meta property="og:description" content="Start with what bothers you. Follow a route forward."><meta property="og:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/08-constellation/social.jpg"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:image" content="https://toys.awwtools.com/public/2026-09-28-ILUDIST/08-constellation/social.jpg"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="base.css">
<style>
:root{--bg:#0d121b;--surface:#181d29;--ink:#e8e2d6;--muted:#b4abb2;--accent:#e7b780;--line:#5a6474}
body{background:radial-gradient(circle at 50% 40%,#283348 0,#10141d 55%,#0b1018)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:radial-gradient(circle,#d4b790 1px,transparent 1px);background-size:57px 77px}
.sky{max-width:900px;margin:auto;position:relative;padding:calc(30px + env(safe-area-inset-top)) 20px calc(55px + env(safe-area-inset-bottom))}
.sky header{text-align:center}.sky header a{font:normal 4.2rem Georgia,serif;color:var(--accent);letter-spacing:-.08em;text-decoration:none}.sky header small{display:block;color:var(--muted);font:10px Arial,sans-serif;letter-spacing:.4em}
.sky h1{font:normal clamp(2.5rem,7vw,5rem)/1 Georgia,serif;text-align:center;margin:55px auto 40px;max-width:720px;letter-spacing:-.04em}
.starline{height:70px;width:1px;background:linear-gradient(var(--accent),#6b7396);margin:0 auto;position:relative}.starline::after{content:"✦";position:absolute;bottom:-10px;left:-9px;color:var(--accent)}
.question{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.question button{min-height:140px;background:#191c2bbf;color:var(--ink);border:1px solid #6a6572;border-radius:50% 50% 13px 13px / 20px 20px 13px 13px;padding:14px;font:normal clamp(1.1rem,3vw,1.55rem)/1.2 Georgia,serif;transition:transform .2s}
.question button{animation:stars-in .5s ease both}@keyframes stars-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.question button:hover,.question button[aria-pressed=true]{border-color:var(--accent);background:#4a3433;transform:translateY(-5px);box-shadow:0 0 20px #d7a37041}
.question button span{display:block;color:var(--accent);font-size:1.5rem;margin-bottom:10px}
.path{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 auto 32px}
.path button{min-height:70px;background:#1b2530;color:var(--ink);border:1px solid var(--line);border-radius:60px;padding:12px;font:1rem Georgia,serif}
.path button[aria-pressed=true]{background:var(--accent);color:#1a181a}
.answer{border:1px solid #b28b67;padding:26px;border-radius:16px;background:radial-gradient(at top,#393040,#171a25 60%);box-shadow:0 0 45px #d7a37028;min-height:210px;text-align:center}
.answer h2{font:normal clamp(1.7rem,5vw,2.8rem) Georgia,serif;margin:12px 0}.answer p{color:var(--muted);line-height:1.5}
.answer button{background:var(--accent);color:#1a1515;border:0;border-radius:30px;padding:14px 28px;min-height:54px}
.sky footer{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.sky footer button{color:var(--ink);background:none;border:1px solid var(--line);min-height:48px;padding:9px 12px}
@media(max-width:530px){.question button{font-size:1rem;min-height:125px;padding:8px}.question button span{font-size:1.1rem}.path button{font-size:.85rem}.sky h1{margin-top:40px}}
</style></head><body><main class="sky"><header><a href="../">ILUD</a><small>THE CONSTELLATION / 08</small></header><h1>What do you want the internet to stop doing?</h1>
<section class="question" id="question" aria-label="Choose what bothers you"><button data-problem="Answering" aria-pressed="true"><span>✧</span>Answering for me</button><button data-problem="Deciding" aria-pressed="false"><span>✦</span>Deciding what I see</button><button data-problem="Generating" aria-pressed="false"><span>✳</span>Generating things</button></section>
<div class="starline" aria-hidden="true"></div><div class="path" id="path" aria-label="Choose a context"></div><section class="answer" id="answer" aria-live="polite"></section>
<footer><button data-browse>Explore every route ⌕</button><button data-saved>Save for later ☆</button></footer></main>
<script src="catalog.js"></script><script src="core.js"></script><script>
ILUD.init();const paths={Answering:["Search","Everyday","Writing"],Deciding:["Social","Video","Everyday"],Generating:["Images","Writing","Search"]};let problem="Answering",category="Search";
function render(){document.querySelectorAll("[data-problem]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.problem===problem)));document.getElementById("path").innerHTML=paths[problem].map(c=>`<button data-path="${c}" aria-pressed="${c===category}">${c}</button>`).join("");const e=ILUD.entries.find(item=>item.category===category&&(problem==="Generating"?item.id==="ddg-images"||item.kind==="alternative":true))||ILUD.entries.find(item=>item.category===category);document.getElementById("answer").innerHTML=`<span class="eyebrow">${problem.toUpperCase()} → ${category.toUpperCase()}</span><h2>${e.title}</h2><p>${e.summary}</p><button data-open="${e.id}">Use this route →</button><p><button data-browse="${category}" style="background:none;color:var(--muted);text-decoration:underline;min-height:44px">More ${category.toLowerCase()} options</button></p>`}
document.getElementById("question").addEventListener("click",e=>{const b=e.target.closest("[data-problem]");if(b){problem=b.dataset.problem;category=paths[problem][0];render()}});
document.getElementById("path").addEventListener("click",e=>{const b=e.target.closest("[data-path]");if(b){category=b.dataset.path;render()}});render();
</script></body></html>
