<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">Edit-distance cell dependencies</title><desc id="desc">Deletion, insertion and substitution add a local cost to an already computed prefix cost. The current cell takes the minimum.</desc><style>text{font:18px system-ui,sans-serif;fill:#172533}.small{font-size:15px}.box{fill:#edf5fc;stroke:#326789;stroke-width:2}.arrow{fill:none;stroke:#326789;stroke-width:2;marker-end:url(#tip)}</style><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#326789"/></marker></defs><rect class="box" x="26" y="28" width="260" height="64" rx="6"/><text x="44" y="55">previous[j-1]</text><text class="small" x="44" y="78">shorter input and candidate</text><rect class="box" x="410" y="28" width="278" height="64" rx="6"/><text x="430" y="55">previous[j]</text><text class="small" x="430" y="78">shorter input</text><rect class="box" x="26" y="210" width="260" height="64" rx="6"/><text x="44" y="238">current[j-1]</text><text class="small" x="44" y="261">shorter candidate</text><rect class="box" x="410" y="210" width="278" height="64" rx="6"/><text x="430" y="238">current[j] = minimum</text><text class="small" x="430" y="261">cost for both current prefixes</text><path class="arrow" d="M286 70L425 204"/><text class="small" x="110" y="147">+ keep (0) or replace (1)</text><path class="arrow" d="M550 92V203"/><text class="small" x="566" y="150">+ delete (1)</text><path class="arrow" d="M286 242H402"/><text class="small" x="297" y="230">+ insert (1)</text></svg>