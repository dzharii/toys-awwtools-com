<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 480" role="img" aria-labelledby="title desc"><title id="title">Exact-first acceptance policy</title><desc id="desc">A unique exact match is accepted. Other inputs require enough score, a sufficient lead and any enabled edit cap. Low score or edit-cap failure is unknown. Close scores are ambiguous.</desc><style>text{font:18px system-ui,sans-serif;fill:#172533}.small{font-size:15px}.box{fill:#edf5fc;stroke:#326789;stroke-width:2}.arrow{fill:none;stroke:#326789;stroke-width:2;marker-end:url(#tip)}</style><defs><marker id="tip" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#326789"/></marker></defs><rect class="box" x="20" y="20" width="300" height="54" rx="6"/><text x="38" y="53">One normalized exact match?</text><rect class="box" x="450" y="20" width="265" height="54" rx="6"/><text x="470" y="53">Accept exact</text><path class="arrow" d="M320 47H442"/><text class="small" x="356" y="36">yes</text><path class="arrow" d="M170 74V120"/><text class="small" x="180" y="105">no</text><rect class="box" x="20" y="128" width="300" height="54" rx="6"/><text x="38" y="161">Best score meets threshold?</text><rect class="box" x="450" y="128" width="265" height="54" rx="6"/><text x="470" y="161">Reject as unknown</text><path class="arrow" d="M320 155H442"/><text class="small" x="356" y="144">no</text><path class="arrow" d="M170 182V228"/><text class="small" x="180" y="213">yes</text><rect class="box" x="20" y="236" width="300" height="54" rx="6"/><text x="38" y="269">Sufficient lead without a tie?</text><rect class="box" x="450" y="236" width="265" height="54" rx="6"/><text x="470" y="269">Reject as ambiguous</text><path class="arrow" d="M320 263H442"/><text class="small" x="356" y="252">no</text><path class="arrow" d="M170 290V336"/><text class="small" x="180" y="321">yes</text><rect class="box" x="20" y="344" width="300" height="54" rx="6"/><text x="38" y="377">Enabled edit cap permits it?</text><rect class="box" x="450" y="344" width="265" height="54" rx="6"/><text x="470" y="377">Accept fuzzy</text><path class="arrow" d="M320 371H442"/><text class="small" x="356" y="360">yes</text><text class="small" x="28" y="438">Cap failure returns unknown. A collided schema is invalid before any of these checks.</text></svg>