<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Reading Navigator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bed"/>
      <stop offset="1" stop-color="#7a5cf0"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Page -->
  <rect x="16" y="12" width="26" height="40" rx="3" fill="#ffffff"/>
  <!-- Text lines (reading) -->
  <rect x="21" y="19" width="16" height="2.6" rx="1.3" fill="#c9cfe8"/>
  <rect x="21" y="25" width="16" height="2.6" rx="1.3" fill="#c9cfe8"/>
  <rect x="21" y="31" width="11" height="2.6" rx="1.3" fill="#c9cfe8"/>
  <!-- Progress bar (active reading band) -->
  <rect x="21" y="40" width="16" height="4" rx="2" fill="#e7e9f5"/>
  <rect x="21" y="40" width="10" height="4" rx="2" fill="#34c759"/>
  <!-- Bookmark / last position marker -->
  <path d="M44 10 h6 a2 2 0 0 1 2 2 v20 l-5 -4 -5 4 v-20 a2 2 0 0 1 2 -2 z" fill="#ffb020" stroke="#ffffff" stroke-width="1.5"/>
</svg>
