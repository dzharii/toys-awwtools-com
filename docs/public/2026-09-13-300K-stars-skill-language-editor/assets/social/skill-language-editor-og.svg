<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Skill Language Editor</title>
  <desc id="description">Application icon beside a compact highlighted skill-language document.</desc>
  <rect width="1200" height="630" fill="#d9d8d3"/>
  <rect x="46" y="42" width="1108" height="546" rx="18" fill="#fbfaf7" stroke="#bebcb5" stroke-width="2"/>
  <rect x="46" y="42" width="1108" height="62" rx="18" fill="#ebe9e3"/>
  <path d="M46 86h1108v18H46z" fill="#ebe9e3"/>
  <circle cx="79" cy="72" r="7" fill="#a34a4a"/>
  <circle cx="103" cy="72" r="7" fill="#c69a45"/>
  <circle cx="127" cy="72" r="7" fill="#568466"/>
  <image href="../../icons/icon.svg" x="90" y="153" width="250" height="250"/>
  <text x="90" y="465" fill="#274252" font-family="system-ui,Segoe UI,sans-serif" font-size="50" font-weight="700">Skill Language Editor</text>
  <text x="92" y="510" fill="#68777a" font-family="system-ui,Segoe UI,sans-serif" font-size="22">Browser editor for structured skill-language documents</text>
  <g transform="translate(680 154)" font-family="DejaVu Sans Mono,Consolas,monospace" font-size="21">
    <text y="0" fill="#315d75">## SKILL Describe the skill</text>
    <text y="60" fill="#2b2a28">Language: uppercase words express structure.</text>
    <rect x="0" y="94" width="120" height="31" rx="4" fill="#dff2f2"/>
    <text x="5" y="117" fill="#216975">DIRECTIVE</text>
    <text x="132" y="117" fill="#2b2a28">apply this skill</text>
    <path d="M13 137v71M39 166v42" stroke="#c8cecc" stroke-width="2" stroke-dasharray="4 5"/>
    <text x="26" y="160" fill="#2b2a28">read the complete skill</text>
    <text x="52" y="190" fill="#2b2a28">follow each applicable rule</text>
    <rect x="0" y="230" width="54" height="31" rx="4" fill="#dff2f2"/>
    <text x="5" y="253" fill="#216975">WHEN</text>
    <text x="66" y="253" fill="#2b2a28">the task matches</text>
    <text x="26" y="289" fill="#6b586f">options (guidance):</text>
    <text x="52" y="323" fill="#7f8c8d">-</text>
    <text x="78" y="323" fill="#2b2a28">first option</text>
  </g>
</svg>
