<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020806">
  <meta name="description" content="A dependency-free retro-futuristic spacecraft terminal built with HTML, CSS, Canvas 2D, and the Web Audio API.">
  <title>Interface 2037</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-label="Retro-futuristic terminal demonstration">
    <section class="terminal-frame" id="terminal-frame">
      <div class="screen-bezel" aria-hidden="true"></div>

      <div class="terminal-screen" id="terminal-screen">
        <canvas id="terminal-canvas" aria-hidden="true"></canvas>

        <div class="screen-reflection" aria-hidden="true"></div>
        <div class="scanline-band" aria-hidden="true"></div>

        <div class="terminal-controls" aria-label="Terminal controls">
          <button type="button" id="audio-toggle" aria-pressed="false">AUDIO: ARMED</button>
          <button type="button" id="effects-toggle">EFFECTS: FULL</button>
          <button type="button" id="replay-boot">REPLAY BOOT</button>
          <button type="button" id="skip-boot">SKIP BOOT</button>
        </div>

        <div class="audio-notice" id="audio-notice">
          PRESS ANY KEY OR CLICK SCREEN TO ACTIVATE AUDIO
        </div>

        <label class="visually-hidden" for="terminal-input">Terminal inquiry</label>
        <textarea
          id="terminal-input"
          rows="1"
          autocomplete="off"
          autocapitalize="characters"
          autocorrect="off"
          spellcheck="false"
          aria-describedby="terminal-help"
        ></textarea>
        <p class="visually-hidden" id="terminal-help">
          Type a command and press Enter. Type HELP to list available commands. Press F2 to toggle audio.
        </p>
        <div class="visually-hidden" id="terminal-transcript" role="log" aria-live="polite" aria-relevant="additions"></div>
      </div>

      <footer class="terminal-footer" aria-hidden="true">
        <span>OM-2037 // INQUIRY SYSTEM</span>
        <span id="build-label">BUILD 1.0.0</span>
      </footer>
    </section>
  </main>

  <noscript>This terminal requires JavaScript.</noscript>
  <script src="app.js"></script>
</body>
</html>
